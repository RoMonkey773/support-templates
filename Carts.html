<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шаблоны для поддержки</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --accent: #0f3460;
            --text: #e0e0e0;
            --highlight: #e94560;
            --success: #4ecca3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2em;
            color: var(--success);
        }

        .search-box {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.1em;
            border: 2px solid var(--accent);
            border-radius: 10px;
            background: var(--card);
            color: var(--text);
            margin-bottom: 20px;
            outline: none;
            transition: all 0.3s;
        }

        .search-box:focus {
            border-color: var(--success);
            box-shadow: 0 0 15px rgba(78, 204, 163, 0.3);
        }

        .category-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .category-btn {
            padding: 8px 16px;
            border: 1px solid var(--accent);
            border-radius: 20px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .category-btn:hover,
        .category-btn.active {
            background: var(--accent);
            border-color: var(--success);
        }

        .template-card {
            background: var(--card);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent);
            transition: all 0.3s;
            position: relative;
        }

        .template-card:hover {
            transform: translateX(5px);
            border-left-color: var(--success);
        }

        .template-title {
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 10px;
            color: var(--highlight);
        }

        .template-category {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--accent);
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.8em;
        }

        .template-text {
            white-space: pre-wrap;
            line-height: 1.6;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 5px;
        }

        .copy-btn {
            background: var(--success);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .copy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(78, 204, 163, 0.4);
        }

        .copy-btn.copied {
            background: #ffd700;
        }

        .loading {
            text-align: center;
            font-size: 1.2em;
            padding: 50px;
            color: var(--success);
        }

        .error {
            text-align: center;
            font-size: 1.1em;
            padding: 30px;
            background: var(--card);
            border-radius: 10px;
            border: 1px solid var(--highlight);
            margin: 20px 0;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.5em;
            }
            .template-text {
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Шаблоны для поддержки</h1>
        
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Поиск по шаблонам...">
        
        <div class="category-buttons" id="categoryButtons"></div>
        
        <div id="templatesContainer">
            <div class="loading">Загрузка шаблонов...</div>
        </div>
    </div>

    <script>
        const SPREADSHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWriQhXiQaFnRHtBPiqIpBT1LUUF2-cBnsXJvu4OKP4zycIc4dLvjVZ1abiF-RrsvaeL2Sgw_ZSUcB/pub?output=csv';

        let allTemplates = [];
        let currentCategory = 'Все';

        // Загрузка данных из Google Sheets
        async function loadTemplates() {
            try {
                const response = await fetch(SPREADSHEET_URL);
                const csvText = await response.text();
                
                // Парсинг CSV
                const rows = csvText.split('\n');
                const headers = rows[0].split(',').map(h => h.trim());
                
                allTemplates = [];
                for (let i = 1; i < rows.length; i++) {
                    if (rows[i].trim() === '') continue;
                    
                    const values = rows[i].split(',');
                    const template = {};
                    
                    headers.forEach((header, index) => {
                        template[header] = values[index] ? values[index].trim() : '';
                    });
                    
                    if (template[headers[0]] || template[headers[1]]) {
                        allTemplates.push(template);
                    }
                }
                
                renderCategories();
                renderTemplates();
            } catch (error) {
                document.getElementById('templatesContainer').innerHTML = `
                    <div class="error">
                        ❌ Ошибка загрузки данных. Проверьте ссылку на таблицу.<br>
                        <small>${error.message}</small>
                    </div>
                `;
            }
        }

        // Отображение категорий
        function renderCategories() {
            const categories = ['Все'];
            
            allTemplates.forEach(template => {
                const categoryKey = Object.keys(template).find(key => 
                    key.toLowerCase().includes('категор') || 
                    key.toLowerCase().includes('раздел') || 
                    key.toLowerCase().includes('тема')
                );
                
                if (categoryKey && template[categoryKey] && !categories.includes(template[categoryKey])) {
                    categories.push(template[categoryKey]);
                }
            });
            
            const container = document.getElementById('categoryButtons');
            container.innerHTML = '';
            
            categories.forEach(category => {
                const button = document.createElement('button');
                button.className = 'category-btn' + (category === currentCategory ? ' active' : '');
                button.textContent = category;
                button.onclick = () => {
                    currentCategory = category;
                    renderCategories();
                    renderTemplates();
                };
                container.appendChild(button);
            });
        }

        // Отображение шаблонов
        function renderTemplates(searchTerm = '') {
            const container = document.getElementById('templatesContainer');
            const filtered = allTemplates.filter(template => {
                const searchableText = Object.values(template).join(' ').toLowerCase();
                const matchesSearch = searchTerm === '' || searchableText.includes(searchTerm.toLowerCase());
                const matchesCategory = currentCategory === 'Все' || 
                    Object.values(template).some(value => 
                        value.toLowerCase() === currentCategory.toLowerCase()
                    );
                return matchesSearch && matchesCategory;
            });
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="error">Ничего не найдено. Попробуйте изменить запрос.</div>';
                return;
            }
            
            container.innerHTML = '';
            
            filtered.forEach(template => {
                // Находим основные поля
                const title = template['Название'] || template['Заголовок'] || template['Шаблон'] || 'Без названия';
                const text = template['Текст'] || template['Содержание'] || template['Ответ'] || Object.values(template)[1] || '';
                const category = template['Категория'] || template['Раздел'] || template['Тема'] || 'Общее';
                
                const card = document.createElement('div');
                card.className = 'template-card';
                
                card.innerHTML = `
                    <div class="template-category">${category}</div>
                    <div class="template-title">${title}</div>
                    <div class="template-text">${text}</div>
                    <button class="copy-btn" onclick="copyTemplate(this, '${text.replace(/'/g, "\\'").replace(/\n/g, '\\n')}')">
                        📋 Копировать
                    </button>
                `;
                
                container.appendChild(card);
            });
        }

        // Копирование в буфер обмена
        function copyTemplate(button, text) {
            const textarea = document.createElement('textarea');
            textarea.value = text.replace(/\\n/g, '\n');
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            
            button.textContent = '✅ Скопировано!';
            button.classList.add('copied');
            
            setTimeout(() => {
                button.textContent = '📋 Копировать';
                button.classList.remove('copied');
            }, 2000);
        }

        // Поиск
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderTemplates(e.target.value);
        });

        // Загрузка при открытии страницы
        loadTemplates();
    </script>
</body>
</html>
