<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>База знаний поддержки</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* ===== ТЕМЫ И ПЕРЕМЕННЫЕ ===== */
        body.theme-purple {
            --bg-main: #f3e8ff;
            --bg-sidebar: #7c3aed;
            --bg-card: #ffffff;
            --text-primary: #1e1b4b;
            --text-secondary: #4c1d95;
            --text-sidebar: #ede9fe;
            --border-color: #c4b5fd;
            --shadow: 0 4px 12px rgba(124, 58, 237, 0.15);
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --input-bg: #ede9fe;
            --scrollbar-track: rgba(255,255,255,0.15);
        }
        body.theme-purple.dark {
            --bg-main: #1e1b4b;
            --bg-sidebar: #2e1065;
            --bg-card: #4c1d95;
            --text-primary: #ede9fe;
            --text-secondary: #c4b5fd;
            --text-sidebar: #ede9fe;
            --border-color: #5b21b6;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --input-bg: #5b21b6;
            --scrollbar-track: rgba(255,255,255,0.1);
        }
        body.theme-wb {
            --bg-main: #f8f9fa;
            --bg-sidebar: #1a1a2e;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-sidebar: #e2e8f0;
            --border-color: #e2e8f0;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --accent: #6c3eb8;
            --accent-hover: #5a2d9e;
            --input-bg: #f1f3f5;
            --scrollbar-track: rgba(255,255,255,0.1);
        }
        body.theme-wb.dark {
            --bg-main: #0f0f1a;
            --bg-sidebar: #1a1a2e;
            --bg-card: #252540;
            --text-primary: #e2e8f0;
            --text-secondary: #a0aec0;
            --text-sidebar: #e2e8f0;
            --border-color: #2d2d4a;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --input-bg: #2d2d4a;
            --scrollbar-track: rgba(255,255,255,0.08);
        }
        body { background: var(--bg-main); color: var(--text-primary); }

        /* ===== САЙДБАР ===== */
        .sidebar {
            width: 280px;
            background: var(--bg-sidebar);
            color: var(--text-sidebar);
            padding: 20px;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            height: 100vh;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }
        
        /* --- ФИШКА 4: Сворачивание сайдбара (ИСПРАВЛЕНО) --- */
        .sidebar.collapsed {
            width: 60px !important;
            overflow: hidden;
        }
        .sidebar.collapsed h2, 
        .sidebar.collapsed .theme-scroll, 
        .sidebar.collapsed .theme-switcher, 
        .sidebar.collapsed #searchInput, 
        .sidebar.collapsed .dark-toggle {
            display: none;
        }
        .sidebar.collapsed #toggleSidebar {
            justify-content: center;
        }
        .sidebar.collapsed .refresh-btn {
            width: 100%;
            text-align: center;
            padding: 10px;
            font-size: 12px;
        }
        /* -------------------------------------- */

        .sidebar h2 {
            font-size: 22px;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 15px;
            color: var(--text-sidebar);
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sidebar .theme-scroll {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 5px;
            margin-right: -5px;
        }
        .sidebar .theme-scroll::-webkit-scrollbar { width: 5px; }
        .sidebar .theme-scroll::-webkit-scrollbar-track { background: var(--scrollbar-track); border-radius: 10px; }
        .sidebar .theme-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        #searchInput {
            width: 100%;
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            margin-bottom: 15px;
            flex-shrink: 0;
        }
        #searchInput::placeholder { color: var(--text-secondary); }

        .theme-btn {
            display: block;
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 6px;
            background: transparent;
            color: var(--text-sidebar);
            border: none;
            border-radius: 8px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .theme-btn:hover { background: rgba(255,255,255,0.15); }
        .theme-btn.active { background: var(--accent); color: white; font-weight: bold; }

        .theme-switcher {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .theme-switcher button {
            flex: 1;
            padding: 6px 10px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: transparent;
            color: var(--text-sidebar);
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .theme-switcher button:hover { background: rgba(255,255,255,0.1); }
        .theme-switcher button.active-switch {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .dark-toggle {
            padding: 8px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: transparent;
            color: var(--text-sidebar);
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
            margin-bottom: 10px;
        }
        .dark-toggle:hover { background: rgba(255,255,255,0.1); }
        .dark-toggle.active-dark {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .sidebar .refresh-btn {
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 8px;
            color: var(--text-sidebar);
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }
        
        /* --- ФИШКА 1: Пульсация кнопки --- */
        .sidebar .refresh-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(124, 58, 237, 0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            animation: pulse-ring 2s infinite;
        }
        @keyframes pulse-ring {
            0% { width: 0; height: 0; opacity: 0.7; }
            100% { width: 300px; height: 300px; opacity: 0; }
        }
        /* ---------------------------------- */
        
        .sidebar .refresh-btn:hover { background: rgba(255,255,255,0.2); }
        
        /* ===== ОСНОВНАЯ ОБЛАСТЬ ===== */
        .content {
            flex: 1;
            padding: 30px 40px;
            overflow: hidden;
            background: var(--bg-main);
            transition: background 0.3s;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .content .content-header { flex-shrink: 0; }
        .content h1 {
            font-size: 26px;
            color: var(--text-primary);
            margin-bottom: 6px;
            transition: color 0.3s;
        }
        .content .subtitle {
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-size: 15px;
            transition: color 0.3s;
        }

        .content .templates-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
            margin-right: -10px;
        }
        .content .templates-scroll::-webkit-scrollbar { width: 6px; }
        .content .templates-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.06); border-radius: 10px; }
        .content .templates-scroll::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        * { scrollbar-width: thin; scrollbar-color: var(--accent) var(--scrollbar-track, rgba(255,255,255,0.1)); }

        /* --- ФИШКА 2: Красивые карточки --- */
        .template-card {
            background: var(--bg-card);
            border-left: 5px solid var(--accent);
            padding: 20px 24px;
            margin-bottom: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }
        .template-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            border-color: var(--border-color);
        }
        /* ---------------------------------- */

        .template-text {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-primary);
            white-space: pre-wrap;
            flex: 1;
            transition: color 0.3s;
        }
        .template-text strong { color: var(--accent); }

        .template-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
            flex-shrink: 0;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }
        .copy-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .copy-btn.copied {
            background: var(--text-primary);
            color: white;
        }

        /* ===== ОШИБКИ ===== */
        .error-container {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none; /* Скрыто по умолчанию */
            animation: fadeIn 0.3s ease;
        }
        .error-title {
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== КНОПКА СВОРАЧИВАНИЯ (ИСПРАВЛЕНО) ===== */
        #toggleSidebar {
            cursor: pointer;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
            color: var(--text-sidebar);
        }
        #toggleSidebar:hover {
            background: rgba(255,255,255,0.1);
        }
        #toggleSidebar span {
            font-size: 12px;
            white-space: nowrap;
        }
        .sidebar.collapsed #toggleSidebar span {
            display: none; /* Скрываем текст при сворачивании */
        }
    </style>
</head>
<body class="theme-purple">

    <!-- Сайдбар -->
    <aside class="sidebar" id="sidebar">
        <h2>
            Темы
            <button id="toggleSidebar" onclick="toggleSidebar()">
                <!-- Иконка стрелочки будет меняться через JS -->
                <span id="toggleText">Свернуть</span>
            </button>
        </h2>

        <input type="text" id="searchInput" placeholder="Поиск по шаблонам...">

        <div class="theme-scroll">
            <button class="theme-btn active" onclick="setTheme('purple')">Фиолет</button>
            <button class="theme-btn" onclick="setTheme('wb')">WB</button>
            <!-- Можно добавить другие темы -->
        </div>

        <div class="theme-switcher">
            <button class="active-switch" onclick="toggleDarkMode(false)">Светлый</button>
            <button onclick="toggleDarkMode(true)">Темный</button>
        </div>

        <button class="dark-toggle" id="darkToggleBtn" onclick="toggleDarkMode()">Ночной режим</button>

        <button class="refresh-btn" onclick="loadData()">Обновить данные</button>
    </aside>

    <!-- Основной контент -->
    <main class="content">
        <div class="content-header">
            <h1 id="pageTitle">База знаний поддержки</h1>
            <div class="subtitle" id="pageSubtitle">Шаблоны ответов и инструкции</div>
        </div>

        <!-- Блок ошибки (теперь рендерится корректно) -->
        <div class="error-container" id="errorBox">
            <span class="error-title" id="errorTitle">Ошибка</span>
            <span id="errorMessage">Подробности ошибки</span>
        </div>

        <div class="templates-scroll" id="templatesContainer">
            <!-- Сюда будут загружаться карточки -->
            <p style="color: var(--text-secondary); margin-top: 20px; text-align: center;">Загрузка данных...</p>
        </div>
    </main>

    <script>
        // ================= ЛОГИКА СВОРАЧИВАНИЯ (ИСПРАВЛЕНО) =================
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggleText = document.getElementById('toggleText');
            
            // Переключаем класс collapsed
            sidebar.classList.toggle('collapsed');
            
            // Меняем текст кнопки
            if (sidebar.classList.contains('collapsed')) {
                toggleText.textContent = 'Развернуть';
            } else {
                toggleText.textContent = 'Свернуть';
            }
        }
        // ===================================================================

        // ================= ТЕМЫ И ТЕМНЫЙ РЕЖИМ =================
        function setTheme(themeName) {
            const body = document.body;
            body.className = `theme-\${themeName}`;
            
            // Сохраняем выбор темы
            localStorage.setItem('app-theme', themeName);
        }

        function toggleDarkMode(forceDark = null) {
            const body = document.body;
            const isDark = forceDark !== null ? forceDark : !body.classList.contains('dark');
            
            if (isDark) {
                body.classList.add('dark');
                document.getElementById('darkToggleBtn').classList.add('active-dark');
            } else {
                body.classList.remove('dark');
                document.getElementById('darkToggleBtn').classList.remove('active-dark');
            }
            
            localStorage.setItem('app-dark', isDark ? 'true' : 'false');
        }

        // Загрузка сохраненных настроек при старте
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('app-theme') || 'purple';
            setTheme(savedTheme);
            
            const savedDark = localStorage.getItem('app-dark') === 'true';
            if (savedDark) {
                toggleDarkMode(true);
            }
        });
        // =========================================================

        // ================= ЗАГРУЗКА ДАННЫХ (МОК-ДАННЫЕ) =================
        async function loadData() {
            const container = document.getElementById('templatesContainer');
            const errorBox = document.getElementById('errorBox');
            const errorTitle = document.getElementById('errorTitle');
            const errorMessage = document.getElementById('errorMessage');

            // Скрываем ошибку при новой загрузке
            errorBox.style.display = 'none';
            container.innerHTML = '<p style="color: var(--text-secondary); margin-top: 20px; text-align: center;">Загрузка данных...</p>';

            try {
                // Имитация запроса к API или Google Sheets
                // Если у тебя есть реальный URL, замени этот блок на fetch(url)
                const response = await new Promise((resolve, reject) => {
                    setTimeout(() => {
                        // МОК-ДАННЫЕ (Пример данных)
                        resolve({
                            ok: true,
                            json: () => Promise.resolve([
                                { id: 1, title: "Возврат товара", text: "Здравствуйте! Спасибо за обращение. Для оформления возврата, пожалуйста, уточните номер заказа." },
                                { id: 2, title: "Задержка доставки", text: "Приносим извинения за задержку. Мы уже связались с курьерской службой для уточнения сроков." },
                                { id: 3, title: "Неверный размер", text: "Если размер не подошел, вы можете оформить возврат в течение 14 дней с момента получения." }
                            ])
                        });
                    }, 800); // Имитация задержки сети
                });

                if (!response.ok) throw new Error("Ошибка сети");

                const data = await response.json();
                renderTemplates(data);

            } catch (error) {
                console.error(error);
                
                // === ИСПРАВЛЕНИЕ ОШИБКИ: Теперь мы берем текст ошибки, а не шаблонную строку ===
                const errMsg = error.message || "Произошла неизвестная ошибка";
                
                errorTitle.textContent = "Ошибка подключения";
                errorMessage.textContent = errMsg;
                errorBox.style.display = 'block';
                
                container.innerHTML = '';
            }
        }

        function renderTemplates(data) {
            const container = document.getElementById('templatesContainer');
            container.innerHTML = '';

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'template-card';
                card.innerHTML = `
                    <div class="template-text">
                        <strong>\${item.title}</strong>
                        <br><br>
                        \${item.text}
                    </div>
                    <div class="template-actions">
                        <button class="copy-btn" onclick="copyText(this, '\${item.text.replace(/"/g, '&quot;')}')" title="Копировать">Копировать</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function copyText(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.textContent;
                btn.textContent = "Скопировано!";
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        // Запуск при загрузке
        loadData();
    </script>
</body>
</html>
