<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои шаблоны для поддержки</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --accent: #0f3460;
            --text: #e0e0e0;
            --highlight: #e94560;
            --success: #4ecca3;
            --warning: #ffd700;
            --danger: #ff6b6b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2em;
            color: var(--success);
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--success);
            color: #000;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(78, 204, 163, 0.4);
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-danger:hover {
            background: #ff4444;
        }

        .btn-warning {
            background: var(--warning);
            color: #000;
        }

        .search-box {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.1em;
            border: 2px solid var(--accent);
            border-radius: 10px;
            background: var(--card);
            color: var(--text);
            margin-bottom: 20px;
            outline: none;
            transition: all 0.3s;
        }

        .search-box:focus {
            border-color: var(--success);
            box-shadow: 0 0 15px rgba(78, 204, 163, 0.3);
        }

        .category-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            align-items: center;
        }

        .category-btn {
            padding: 8px 16px;
            border: 1px solid var(--accent);
            border-radius: 20px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .category-btn:hover,
        .category-btn.active {
            background: var(--accent);
            border-color: var(--success);
        }

        .category-btn-edit {
            padding: 4px 8px;
            border: 1px solid var(--warning);
            border-radius: 15px;
            background: transparent;
            color: var(--warning);
            cursor: pointer;
            font-size: 0.7em;
        }

        .template-card {
            background: var(--card);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent);
            transition: all 0.3s;
            position: relative;
        }

        .template-card:hover {
            transform: translateX(5px);
            border-left-color: var(--success);
        }

        .template-title {
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 10px;
            color: var(--highlight);
            padding-right: 150px;
        }

        .template-category {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--accent);
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.8em;
        }

        .template-text {
            white-space: pre-wrap;
            line-height: 1.6;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 5px;
        }

        .template-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .copy-btn {
            background: var(--success);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .copy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(78, 204, 163, 0.4);
        }

        .copy-btn.copied {
            background: #ffd700;
        }

        .edit-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .delete-btn {
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card);
            border-radius: 10px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: var(--success);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text);
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--accent);
            border-radius: 5px;
            background: var(--bg);
            color: var(--text);
            font-size: 1em;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--success);
            outline: none;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            background: var(--card);
            border-radius: 10px;
            color: #aaa;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.5em;
            }
            .template-text {
                font-size: 0.9em;
            }
            .template-title {
                padding-right: 0;
                margin-bottom: 30px;
            }
            .modal-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Мои шаблоны для поддержки</h1>
        
        <div class="toolbar">
            <button class="btn btn-primary" onclick="openAddModal()">➕ Новый шаблон</button>
            <button class="btn btn-warning" onclick="exportData()">📤 Экспорт</button>
            <button class="btn btn-warning" onclick="importData()">📥 Импорт</button>
            <button class="btn btn-danger" onclick="clearAll()">🗑️ Очистить всё</button>
        </div>
        
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Поиск по шаблонам...">
        
        <div class="category-buttons" id="categoryButtons"></div>
        
        <div id="templatesContainer"></div>
    </div>

    <!-- Модальное окно для добавления/редактирования -->
    <div class="modal" id="templateModal">
        <div class="modal-content">
            <h2 id="modalTitle">Новый шаблон</h2>
            
            <div class="form-group">
                <label for="templateName">Название шаблона</label>
                <input type="text" id="templateName" placeholder="Например: Приветствие клиента">
            </div>
            
            <div class="form-group">
                <label for="templateCategory">Категория</label>
                <input type="text" id="templateCategory" list="categoriesList" placeholder="Например: Общение, Оплата, Доставка">
                <datalist id="categoriesList"></datalist>
            </div>
            
            <div class="form-group">
                <label for="templateText">Текст шаблона</label>
                <textarea id="templateText" placeholder="Введите текст шаблона..."></textarea>
            </div>
            
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="saveTemplate()">💾 Сохранить</button>
                <button class="btn btn-danger" onclick="closeModal()">❌ Отмена</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // ХРАНИЛИЩЕ ДАННЫХ (localStorage)
        // ============================================
        const STORAGE_KEY = 'supportTemplates';
        let allTemplates = [];
        let currentCategory = 'Все';
        let editingIndex = -1;

        // Загрузка из localStorage
        function loadFromStorage() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    allTemplates = JSON.parse(saved);
                } catch (error) {
                    console.error('Ошибка загрузки данных:', error);
                    allTemplates = getDefaultTemplates();
                }
            } else {
                allTemplates = getDefaultTemplates();
                saveToStorage();
            }
        }

        // Сохранение в localStorage
        function saveToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(allTemplates));
        }

        // Шаблоны по умолчанию (для первого запуска)
        function getDefaultTemplates() {
            return [
                {
                    name: 'Приветствие',
                    category: 'Общение',
                    text: 'Здравствуйте! Спасибо, что обратились в нашу поддержку. Меня зовут [Имя]. Подскажите, пожалуйста, номер вашего заказа или email, чтобы я мог(ла) вам помочь.'
                },
                {
                    name: 'Прощание',
                    category: 'Общение',
                    text: 'Спасибо за обращение! Если у вас появятся ещё вопросы — пишите, мы всегда на связи. Хорошего дня!'
                },
                {
                    name: 'Ожидание ответа',
                    category: 'Общение',
                    text: 'Пожалуйста, подождите немного — я проверяю информацию по вашему вопросу. Это займёт не более 2-3 минут.'
                },
                {
                    name: 'Проблема с оплатой',
                    category: 'Оплата',
                    text: 'Понимаю ваше беспокойство. Давайте разберёмся с оплатой. Пожалуйста, пришлите скриншот ошибки или номер транзакции, если он есть.'
                },
                {
                    name: 'Не пришёл заказ',
                    category: 'Доставка',
                    text: 'Мне жаль, что ваш заказ ещё не доставлен. Давайте я проверю его статус. Подскажите, пожалуйста, номер заказа.'
                }
            ];
        }

        // ============================================
        // ОТОБРАЖЕНИЕ
        // ============================================
        function renderCategories() {
            const categories = ['Все'];
            
            allTemplates.forEach(template => {
                if (template.category && !categories.includes(template.category)) {
                    categories.push(template.category);
                }
            });
            
            const container = document.getElementById('categoryButtons');
            container.innerHTML = '';
            
            categories.forEach(category => {
                const button = document.createElement('button');
                button.className = 'category-btn' + (category === currentCategory ? ' active' : '');
                button.textContent = category;
                button.onclick = () => {
                    currentCategory = category;
                    renderCategories();
                    renderTemplates();
                };
                container.appendChild(button);
            });
            
            // Обновляем список категорий в модальном окне
            const datalist = document.getElementById('categoriesList');
            datalist.innerHTML = '';
            categories.forEach(category => {
                if (category !== 'Все') {
                    const option = document.createElement('option');
                    option.value = category;
                    datalist.appendChild(option);
                }
            });
        }

        function renderTemplates(searchTerm = '') {
            const container = document.getElementById('templatesContainer');
            
            if (allTemplates.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>Нет ни одного шаблона</h3>
                        <p>Нажмите "➕ Новый шаблон", чтобы создать первый</p>
                    </div>
                `;
                return;
            }
            
            const filtered = allTemplates.filter(template => {
                const searchableText = `${template.name} ${template.category} ${template.text}`.toLowerCase();
                const matchesSearch = searchTerm === '' || searchableText.includes(searchTerm.toLowerCase());
                const matchesCategory = currentCategory === 'Все' || template.category === currentCategory;
                return matchesSearch && matchesCategory;
            });
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">Ничего не найдено. Попробуйте изменить запрос.</div>';
                return;
            }
            
            container.innerHTML = '';
            
            filtered.forEach(template => {
                const originalIndex = allTemplates.indexOf(template);
                const card = document.createElement('div');
                card.className = 'template-card';
                
                card.innerHTML = `
                    <div class="template-category">${escapeHtml(template.category || 'Без категории')}</div>
                    <div class="template-title">${escapeHtml(template.name)}</div>
                    <div class="template-text">${escapeHtml(template.text)}</div>
                    <div class="template-actions">
                        <button class="copy-btn" onclick="copyTemplate(${originalIndex})">📋 Копировать</button>
                        <button class="edit-btn" onclick="openEditModal(${originalIndex})">✏️ Редактировать</button>
                        <button class="delete-btn" onclick="deleteTemplate(${originalIndex})">🗑️ Удалить</button>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        // ============================================
        // CRUD ОПЕРАЦИИ
        // ============================================
        function openAddModal() {
            editingIndex = -1;
            document.getElementById('modalTitle').textContent = 'Новый шаблон';
            document.getElementById('templateName').value = '';
            document.getElementById('templateCategory').value = '';
            document.getElementById('templateText').value = '';
            document.getElementById('templateModal').classList.add('active');
            document.getElementById('templateName').focus();
        }

        function openEditModal(index) {
            editingIndex = index;
            const template = allTemplates[index];
            document.getElementById('modalTitle').textContent = 'Редактировать шаблон';
            document.getElementById('templateName').value = template.name;
            document.getElementById('templateCategory').value = template.category || '';
            document.getElementById('templateText').value = template.text;
            document.getElementById('templateModal').classList.add('active');
            document.getElementById('templateName').focus();
        }

        function closeModal() {
            document.getElementById('templateModal').classList.remove('active');
        }

        function saveTemplate() {
            const name = document.getElementById('templateName').value.trim();
            const category = document.getElementById('templateCategory').value.trim();
            const text = document.getElementById('templateText').value.trim();
            
            if (!name || !text) {
                alert('Пожалуйста, заполните название и текст шаблона');
                return;
            }
            
            if (editingIndex === -1) {
                // Добавление нового
                allTemplates.push({
                    name: name,
                    category: category || 'Общее',
                    text: text
                });
            } else {
                // Редактирование существующего
                allTemplates[editingIndex] = {
                    name: name,
                    category: category || 'Общее',
                    text: text
                };
            }
            
            saveToStorage();
            closeModal();
            renderCategories();
            renderTemplates(document.getElementById('searchInput').value);
        }

        function deleteTemplate(index) {
            const template = allTemplates[index];
            if (confirm(`Удалить шаблон "${template.name}"?`)) {
                allTemplates.splice(index, 1);
                saveToStorage();
                renderCategories();
                renderTemplates(document.getElementById('searchInput').value);
            }
        }

        // ============================================
        // КОПИРОВАНИЕ
        // ============================================
        function copyTemplate(index) {
            const template = allTemplates[index];
            const text = template.text;
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text)
                    .then(() => showCopied(index))
                    .catch(() => fallbackCopy(text, index));
            } else {
                fallbackCopy(text, index);
            }
        }

        function fallbackCopy(text, index) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showCopied(index);
            } catch (error) {
                alert('Не удалось скопировать. Скопируйте текст вручную.');
            }
            
            document.body.removeChild(textarea);
        }

        function showCopied(index) {
            const buttons = document.querySelectorAll('.copy-btn');
            if (buttons[index]) {
                const originalText = buttons[index].textContent;
                buttons[index].textContent = '✅ Скопировано!';
                buttons[index].classList.add('copied');
                
                setTimeout(() => {
                    buttons[index].textContent = originalText;
                    buttons[index].classList.remove('copied');
                }, 2000);
            }
        }

        // ============================================
        // ЭКСПОРТ / ИМПОРТ
        // ============================================
        function exportData() {
            const data = JSON.stringify(allTemplates, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'my_templates_backup.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (Array.isArray(imported)) {
                            allTemplates = imported;
                            saveToStorage();
                            renderCategories();
                            renderTemplates();
                            alert('Данные успешно импортированы!');
                        } else {
                            alert('Неверный формат файла');
                        }
                    } catch (error) {
                        alert('Ошибка импорта: ' + error.message);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function clearAll() {
            if (confirm('Вы уверены, что хотите удалить ВСЕ шаблоны? Это действие нельзя отменить!')) {
                allTemplates = [];
                saveToStorage();
                renderCategories();
                renderTemplates();
            }
        }

        // ============================================
        // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================
        // ОБРАБОТЧИКИ СОБЫТИЙ
        // ============================================
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderTemplates(e.target.value);
        });

        // Закрытие модального окна по клику вне
        document.getElementById('templateModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('templateModal')) {
                closeModal();
            }
        });

        // Закрытие по Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Сохранение по Ctrl+Enter
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                if (document.getElementById('templateModal').classList.contains('active')) {
                    saveTemplate();
                }
            }
        });

        // ============================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================
        loadFromStorage();
        renderCategories();
        renderTemplates();
    </script>
</body>
</html>
