<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шаблоны для поддержки</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --accent: #0f3460;
            --text: #e0e0e0;
            --highlight: #e94560;
            --success: #4ecca3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2em;
            color: var(--success);
        }

        .status-bar {
            text-align: center;
            margin-bottom: 15px;
            font-size: 0.85em;
            color: #aaa;
        }

        .status-bar.success {
            color: var(--success);
        }

        .status-bar.error {
            color: #ff6b6b;
        }

        .search-box {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.1em;
            border: 2px solid var(--accent);
            border-radius: 10px;
            background: var(--card);
            color: var(--text);
            margin-bottom: 20px;
            outline: none;
            transition: all 0.3s;
        }

        .search-box:focus {
            border-color: var(--success);
            box-shadow: 0 0 15px rgba(78, 204, 163, 0.3);
        }

        .category-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .category-btn {
            padding: 8px 16px;
            border: 1px solid var(--accent);
            border-radius: 20px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .category-btn:hover,
        .category-btn.active {
            background: var(--accent);
            border-color: var(--success);
        }

        .template-card {
            background: var(--card);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent);
            transition: all 0.3s;
            position: relative;
        }

        .template-card:hover {
            transform: translateX(5px);
            border-left-color: var(--success);
        }

        .template-title {
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 10px;
            color: var(--highlight);
            padding-right: 100px;
        }

        .template-category {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--accent);
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.8em;
        }

        .template-text {
            white-space: pre-wrap;
            line-height: 1.6;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 5px;
        }

        .copy-btn {
            background: var(--success);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .copy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(78, 204, 163, 0.4);
        }

        .copy-btn.copied {
            background: #ffd700;
        }

        .loading {
            text-align: center;
            font-size: 1.2em;
            padding: 50px;
            color: var(--success);
        }

        .error {
            text-align: center;
            font-size: 1.1em;
            padding: 30px;
            background: var(--card);
            border-radius: 10px;
            border: 1px solid var(--highlight);
            margin: 20px 0;
            color: #ff6b6b;
        }

        .retry-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: var(--success);
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.5em;
            }
            .template-text {
                font-size: 0.9em;
            }
            .template-title {
                padding-right: 0;
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Шаблоны для поддержки</h1>
        
        <div class="status-bar" id="statusBar">Загрузка...</div>
        
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Поиск по шаблонам...">
        
        <div class="category-buttons" id="categoryButtons"></div>
        
        <div id="templatesContainer">
            <div class="loading">Загрузка шаблонов...</div>
        </div>
    </div>

    <script>
        // ============================================
        // НАСТРОЙКА
        // ============================================
        const GOOGLE_SHEETS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWriQhXiQaFnRHtBPiqIpBT1LUUF2-cBnsXJvu4OKP4zycIc4dLvjVZ1abiF-RrsvaeL2Sgw_ZSUcB/pub?output=csv';

        // Резервные шаблоны (на случай, если Google недоступен)
        const FALLBACK_TEMPLATES = [
            {
                'Название': 'Приветствие',
                'Категория': 'Общение',
                'Текст': 'Здравствуйте! Спасибо, что обратились в нашу поддержку. Меня зовут [Имя]. Подскажите, пожалуйста, номер вашего заказа или email, чтобы я мог(ла) вам помочь.'
            },
            {
                'Название': 'Прощание',
                'Категория': 'Общение',
                'Текст': 'Спасибо за обращение! Если у вас появятся ещё вопросы — пишите, мы всегда на связи. Хорошего дня!'
            },
            {
                'Название': 'Ожидание ответа',
                'Категория': 'Общение',
                'Текст': 'Пожалуйста, подождите немного — я проверяю информацию по вашему вопросу. Это займёт не более 2-3 минут.'
            },
            {
                'Название': 'Проблема с оплатой',
                'Категория': 'Оплата',
                'Текст': 'Понимаю ваше беспокойство. Давайте разберёмся с оплатой. Пожалуйста, пришлите скриншот ошибки или номер транзакции, если он есть.'
            },
            {
                'Название': 'Возврат средств',
                'Категория': 'Оплата',
                'Текст': 'Я оформил(а) запрос на возврат средств. Деньги вернутся на карту в течение 3-10 рабочих дней, в зависимости от вашего банка.'
            },
            {
                'Название': 'Не пришёл заказ',
                'Категория': 'Доставка',
                'Текст': 'Мне жаль, что ваш заказ ещё не доставлен. Давайте я проверю его статус. Подскажите, пожалуйста, номер заказа.'
            },
            {
                'Название': 'Заказ задерживается',
                'Категория': 'Доставка',
                'Текст': 'Приносим извинения за задержку. Курьерская служба иногда сталкивается с непредвиденными обстоятельствами. Я проверю, где сейчас ваш заказ, и сообщу вам.'
            }
        ];

        let allTemplates = [];
        let currentCategory = 'Все';
        let dataSource = '';

        // Загрузка данных
        async function loadTemplates() {
            const container = document.getElementById('templatesContainer');
            const statusBar = document.getElementById('statusBar');
            container.innerHTML = '<div class="loading">Загрузка шаблонов...</div>';
            statusBar.textContent = 'Загрузка...';
            statusBar.className = 'status-bar';
            
            // Пробуем прямой запрос к Google
            try {
                const csvText = await fetchDirect(GOOGLE_SHEETS_URL);
                if (csvText && csvText.trim().length > 0 && csvText.includes(',')) {
                    parseCSV(csvText);
                    dataSource = 'Данные загружены из Google Sheets';
                    statusBar.textContent = '✓ ' + dataSource;
                    statusBar.className = 'status-bar success';
                    renderCategories();
                    renderTemplates();
                    return;
                }
            } catch (error) {
                console.log('Прямой запрос не сработал:', error.message);
            }
            
            // Пробуем через прокси
            try {
                const csvText = await fetchWithProxy(GOOGLE_SHEETS_URL);
                if (csvText && csvText.trim().length > 0 && csvText.includes(',')) {
                    parseCSV(csvText);
                    dataSource = 'Данные загружены через прокси';
                    statusBar.textContent = '✓ ' + dataSource;
                    statusBar.className = 'status-bar success';
                    renderCategories();
                    renderTemplates();
                    return;
                }
            } catch (error) {
                console.log('Прокси не сработал:', error.message);
            }
            
            // Используем резервные шаблоны
            allTemplates = FALLBACK_TEMPLATES;
            dataSource = 'Резервные шаблоны (Google недоступен)';
            statusBar.textContent = '⚠ ' + dataSource;
            statusBar.className = 'status-bar error';
            renderCategories();
            renderTemplates();
        }

        // Прямой запрос
        async function fetchDirect(url) {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            return await response.text();
        }

        // Запрос через прокси
        async function fetchWithProxy(url) {
            const proxies = [
                'https://api.allorigins.win/raw?url=',
                'https://corsproxy.io/?url=',
                'https://api.codetabs.com/v1/proxy?quest='
            ];
            
            let lastError;
            for (const proxy of proxies) {
                try {
                    const proxyUrl = proxy + encodeURIComponent(url);
                    const response = await fetch(proxyUrl);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    return await response.text();
                } catch (error) {
                    lastError = error;
                }
            }
            throw lastError;
        }

        // Парсинг CSV
        function parseCSV(csvText) {
            const rows = csvText.split('\n').filter(row => row.trim() !== '');
            if (rows.length < 2) return;
            
            const headers = parseCSVLine(rows[0]);
            
            allTemplates = [];
            for (let i = 1; i < rows.length; i++) {
                const values = parseCSVLine(rows[i]);
                const template = {};
                
                headers.forEach((header, index) => {
                    template[header] = values[index] ? values[index].trim() : '';
                });
                
                if (Object.values(template).some(v => v !== '')) {
                    allTemplates.push(template);
                }
            }
        }

        // Правильный парсинг CSV строки
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            
            result.push(current);
            return result;
        }

        // Отображение категорий
        function renderCategories() {
            const categories = ['Все'];
            
            allTemplates.forEach(template => {
                const categoryKey = Object.keys(template).find(key => 
                    key.toLowerCase().includes('категор') || 
                    key.toLowerCase().includes('раздел') || 
                    key.toLowerCase().includes('тема') ||
                    key.toLowerCase().includes('тип')
                );
                
                if (categoryKey && template[categoryKey] && !categories.includes(template[categoryKey])) {
                    categories.push(template[categoryKey]);
                }
            });
            
            const container = document.getElementById('categoryButtons');
            container.innerHTML = '';
            
            categories.forEach(category => {
                const button = document.createElement('button');
                button.className = 'category-btn' + (category === currentCategory ? ' active' : '');
                button.textContent = category;
                button.onclick = () => {
                    currentCategory = category;
                    renderCategories();
                    renderTemplates(document.getElementById('searchInput').value);
                };
                container.appendChild(button);
            });
        }

        // Отображение шаблонов
        function renderTemplates(searchTerm = '') {
            const container = document.getElementById('templatesContainer');
            
            if (allTemplates.length === 0) {
                container.innerHTML = '<div class="error">Нет данных для отображения</div>';
                return;
            }
            
            const filtered = allTemplates.filter(template => {
                const searchableText = Object.values(template).join(' ').toLowerCase();
                const matchesSearch = searchTerm === '' || searchableText.includes(searchTerm.toLowerCase());
                const matchesCategory = currentCategory === 'Все' || 
                    Object.values(template).some(value => 
                        value.toLowerCase() === currentCategory.toLowerCase()
                    );
                return matchesSearch && matchesCategory;
            });
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="error">Ничего не найдено. Попробуйте изменить запрос.</div>';
                return;
            }
            
            container.innerHTML = '';
            
            filtered.forEach(template => {
                const title = template['Название'] || 
                              template['Заголовок'] || 
                              template['Шаблон'] || 
                              template['Название шаблона'] ||
                              Object.values(template)[0] || 
                              'Без названия';
                              
                const text = template['Текст'] || 
                             template['Содержание'] || 
                             template['Ответ'] || 
                             template['Текст шаблона'] ||
                             Object.values(template)[1] || 
                             '';
                             
                const category = template['Категория'] || 
                                 template['Раздел'] || 
                                 template['Тема'] || 
                                 template['Тип'] ||
                                 'Общее';
                
                const card = document.createElement('div');
                card.className = 'template-card';
                
                card.innerHTML = `
                    <div class="template-category">${escapeHtml(category)}</div>
                    <div class="template-title">${escapeHtml(title)}</div>
                    <div class="template-text">${escapeHtml(text)}</div>
                    <button class="copy-btn" onclick="copyTemplate(this, '${escapeForJs(text)}')">
                        📋 Копировать
                    </button>
                `;
                
                container.appendChild(card);
            });
        }

        // Экранирование HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Экранирование для JavaScript строки
        function escapeForJs(text) {
            return text.replace(/\\/g, '\\\\')
                       .replace(/'/g, "\\'")
                       .replace(/\n/g, '\\n')
                       .replace(/\r/g, '');
        }

        // Копирование в буфер обмена
        function copyTemplate(button, text) {
            const decodedText = text.replace(/\\n/g, '\n').replace(/\\\\/g, '\\');
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(decodedText)
                    .then(() => showCopied(button))
                    .catch(() => fallbackCopy(decodedText, button));
            } else {
                fallbackCopy(decodedText, button);
            }
        }

        // Запасной способ копирования
        function fallbackCopy(text, button) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showCopied(button);
            } catch (error) {
                alert('Не удалось скопировать. Скопируйте текст вручную.');
            }
            
            document.body.removeChild(textarea);
        }

        // Показать "Скопировано"
        function showCopied(button) {
            const originalText = button.textContent;
            button.textContent = '✅ Скопировано!';
            button.classList.add('copied');
            
            setTimeout(() => {
                button.textContent = originalText;
                button.classList.remove('copied');
            }, 2000);
        }

        // Поиск
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderTemplates(e.target.value);
        });

        // Загрузка при открытии
        loadTemplates();
    </script>
</body>
</html>
