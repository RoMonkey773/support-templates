<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шаблоны для поддержки</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --accent: #0f3460;
            --text: #e0e0e0;
            --highlight: #e94560;
            --success: #4ecca3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2em;
            color: var(--success);
        }

        .search-box {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.1em;
            border: 2px solid var(--accent);
            border-radius: 10px;
            background: var(--card);
            color: var(--text);
            margin-bottom: 20px;
            outline: none;
            transition: all 0.3s;
        }

        .search-box:focus {
            border-color: var(--success);
            box-shadow: 0 0 15px rgba(78, 204, 163, 0.3);
        }

        .category-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .category-btn {
            padding: 8px 16px;
            border: 1px solid var(--accent);
            border-radius: 20px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .category-btn:hover,
        .category-btn.active {
            background: var(--accent);
            border-color: var(--success);
        }

        .template-card {
            background: var(--card);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent);
            transition: all 0.3s;
            position: relative;
        }

        .template-card:hover {
            transform: translateX(5px);
            border-left-color: var(--success);
        }

        .template-title {
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 10px;
            color: var(--highlight);
            padding-right: 100px;
        }

        .template-category {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--accent);
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.8em;
        }

        .template-text {
            white-space: pre-wrap;
            line-height: 1.6;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 5px;
        }

        .copy-btn {
            background: var(--success);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .copy-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(78, 204, 163, 0.4);
        }

        .copy-btn.copied {
            background: #ffd700;
        }

        .loading {
            text-align: center;
            font-size: 1.2em;
            padding: 50px;
            color: var(--success);
        }

        .error {
            text-align: center;
            font-size: 1.1em;
            padding: 30px;
            background: var(--card);
            border-radius: 10px;
            border: 1px solid var(--highlight);
            margin: 20px 0;
            color: #ff6b6b;
        }

        .error small {
            display: block;
            margin-top: 10px;
            color: #aaa;
            font-size: 0.8em;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.5em;
            }
            .template-text {
                font-size: 0.9em;
            }
            .template-title {
                padding-right: 0;
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Шаблоны для поддержки</h1>
        
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Поиск по шаблонам...">
        
        <div class="category-buttons" id="categoryButtons"></div>
        
        <div id="templatesContainer">
            <div class="loading">Загрузка шаблонов...</div>
        </div>
    </div>

    <script>
        // ============================================
        // НАСТРОЙКА: ССЫЛКА НА GOOGLE SHEETS
        // ============================================
        const GOOGLE_SHEETS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWriQhXiQaFnRHtBPiqIpBT1LUUF2-cBnsXJvu4OKP4zycIc4dLvjVZ1abiF-RrsvaeL2Sgw_ZSUcB/pub?output=csv';

        // Прокси для обхода CORS (можно менять на запасные)
        const CORS_PROXIES = [
            'https://api.allorigins.win/raw?url=',
            'https://corsproxy.io/?url=',
            'https://api.codetabs.com/v1/proxy?quest='
        ];

        let currentProxyIndex = 0;
        let allTemplates = [];
        let currentCategory = 'Все';

        // Загрузка данных из Google Sheets с обходом CORS
        async function loadTemplates() {
            const container = document.getElementById('templatesContainer');
            container.innerHTML = '<div class="loading">Загрузка шаблонов...</div>';
            
            try {
                const csvText = await fetchWithProxy(GOOGLE_SHEETS_URL);
                parseCSV(csvText);
                renderCategories();
                renderTemplates();
            } catch (error) {
                container.innerHTML = `
                    <div class="error">
                        ❌ Не удалось загрузить данные. Проверьте ссылку и интернет.<br>
                        <small>Подробности: ${error.message}</small>
                    </div>
                `;
            }
        }

        // Функция с попыткой загрузки через разные прокси
        async function fetchWithProxy(url) {
            let lastError;
            
            for (let i = 0; i < CORS_PROXIES.length; i++) {
                try {
                    const proxyUrl = CORS_PROXIES[i] + encodeURIComponent(url);
                    const response = await fetch(proxyUrl);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const text = await response.text();
                    return text;
                } catch (error) {
                    lastError = error;
                    currentProxyIndex = (currentProxyIndex + 1) % CORS_PROXIES.length;
                }
            }
            
            throw lastError;
        }

        // Парсинг CSV
        function parseCSV(csvText) {
            const rows = csvText.split('\n').filter(row => row.trim() !== '');
            const headers = parseCSVLine(rows[0]);
            
            allTemplates = [];
            for (let i = 1; i < rows.length; i++) {
                const values = parseCSVLine(rows[i]);
                const template = {};
                
                headers.forEach((header, index) => {
                    template[header] = values[index] ? values[index].trim() : '';
                });
                
                // Добавляем только если есть хоть какие-то данные
                if (Object.values(template).some(v => v !== '')) {
                    allTemplates.push(template);
                }
            }
        }

        // Правильный парсинг CSV строк (учитывает кавычки)
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            
            result.push(current);
            return result;
        }

        // Отображение категорий
        function renderCategories() {
            const categories = ['Все'];
            
            allTemplates.forEach(template => {
                const categoryKey = Object.keys(template).find(key => 
                    key.toLowerCase().includes('категор') || 
                    key.toLowerCase().includes('раздел') || 
                    key.toLowerCase().includes('тема') ||
                    key.toLowerCase().includes('тип')
                );
                
                if (categoryKey && template[categoryKey] && !categories.includes(template[categoryKey])) {
                    categories.push(template[categoryKey]);
                }
            });
            
            const container = document.getElementById('categoryButtons');
            container.innerHTML = '';
            
            categories.forEach(category => {
                const button = document.createElement('button');
                button.className = 'category-btn' + (category === currentCategory ? ' active' : '');
                button.textContent = category;
                button.onclick = () => {
                    currentCategory = category;
                    renderCategories();
                    renderTemplates(document.getElementById('searchInput').value);
                };
                container.appendChild(button);
            });
        }

        // Отображение шаблонов
        function renderTemplates(searchTerm = '') {
            const container = document.getElementById('templatesContainer');
            
            if (allTemplates.length === 0) {
                container.innerHTML = '<div class="error">В таблице не найдено данных</div>';
                return;
            }
            
            const filtered = allTemplates.filter(template => {
                const searchableText = Object.values(template).join(' ').toLowerCase();
                const matchesSearch = searchTerm === '' || searchableText.includes(searchTerm.toLowerCase());
                const matchesCategory = currentCategory === 'Все' || 
                    Object.values(template).some(value => 
                        value.toLowerCase() === currentCategory.toLowerCase()
                    );
                return matchesSearch && matchesCategory;
            });
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="error">Ничего не найдено. Попробуйте изменить запрос.</div>';
                return;
            }
            
            container.innerHTML = '';
            
            filtered.forEach(template => {
                // Находим основные поля
                const title = template['Название'] || 
                              template['Заголовок'] || 
                              template['Шаблон'] || 
                              template['Название шаблона'] ||
                              Object.values(template)[0] || 
                              'Без названия';
                              
                const text = template['Текст'] || 
                             template['Содержание'] || 
                             template['Ответ'] || 
                             template['Текст шаблона'] ||
                             Object.values(template)[1] || 
                             '';
                             
                const category = template['Категория'] || 
                                 template['Раздел'] || 
                                 template['Тема'] || 
                                 template['Тип'] ||
                                 'Общее';
                
                const card = document.createElement('div');
                card.className = 'template-card';
                
                // Экранируем кавычки для безопасного JavaScript
                const safeText = text.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n').replace(/\r/g, '');
                
                card.innerHTML = `
                    <div class="template-category">${escapeHtml(category)}</div>
                    <div class="template-title">${escapeHtml(title)}</div>
                    <div class="template-text">${escapeHtml(text)}</div>
                    <button class="copy-btn" onclick="copyTemplate(this, '${safeText}')">
                        📋 Копировать
                    </button>
                `;
                
                container.appendChild(card);
            });
        }

        // Экранирование HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Копирование в буфер обмена
        function copyTemplate(button, text) {
            const decodedText = text.replace(/\\n/g, '\n').replace(/\\\\/g, '\\');
            
            // Современный способ
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(decodedText).then(() => {
                    showCopied(button);
                }).catch(() => {
                    // Запасной способ
                    fallbackCopy(decodedText, button);
                });
            } else {
                // Запасной способ для старых браузеров
                fallbackCopy(decodedText, button);
            }
        }

        // Запасной способ копирования
        function fallbackCopy(text, button) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showCopied(button);
            } catch (error) {
                alert('Не удалось скопировать текст. Скопируйте вручную.');
            }
            
            document.body.removeChild(textarea);
        }

        // Показать "Скопировано"
        function showCopied(button) {
            const originalText = button.textContent;
            button.textContent = '✅ Скопировано!';
            button.classList.add('copied');
            
            setTimeout(() => {
                button.textContent = originalText;
                button.classList.remove('copied');
            }, 2000);
        }

        // Поиск
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderTemplates(e.target.value);
        });

        // Кнопка "Обновить" при ошибке
        document.addEventListener('click', (e) => {
            if (e.target.id === 'retryBtn') {
                loadTemplates();
            }
        });

        // Загрузка при открытии страницы
        loadTemplates();
    </script>
</body>
</html>
