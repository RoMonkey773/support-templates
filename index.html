<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WB База знаний</title>
    <!-- Библиотека для надежного чтения CSV (чтобы запятые в текстах не ломали всё) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
      :root {
        /* Светлая тема (WB стиль) */
        --bg-page: #f5f6f8;
        --bg-sidebar: #ffffff;
        --text-main: #131313;
        --text-secondary: #6b6f7c;
        --border: #e0e2e6;
        --accent: #9d22ee;
        --accent-hover: #821ad1;
        --accent-light: #f4eef9;
        --card-bg: #ffffff;
      }

      [data-theme="dark"] {
        /* Тёмная тема (WB стиль) */
        --bg-page: #1e1e24;
        --bg-sidebar: #2a2a32;
        --text-main: #f0f0f2;
        --text-secondary: #9ca3af;
        --border: #374151;
        --accent: #c97bf5;
        --accent-hover: #a656d6;
        --accent-light: #3a2d5e;
        --card-bg: #2a2a32;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        background-color: var(--bg-page);
        color: var(--text-main);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: background 0.3s, color 0.3s;
      }

      header {
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--bg-sidebar);
        z-index: 10;
      }

      .toolbar { display: flex; gap: 12px; align-items: center; }

      input[type="search"] {
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg-sidebar);
        color: var(--text-main);
        min-width: 220px;
      }
      input[type="search"]:focus { outline: 2px solid var(--accent); }

      button.btn {
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s;
      }
      .btn-primary { background: var(--accent); color: #fff; }
      .btn-primary:hover { background: var(--accent-hover); }
      .btn-outline {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-main);
      }
      .btn-outline:hover { border-color: var(--accent); }
      .btn:disabled { opacity: 0.6; cursor: not-allowed; }

      main {
        display: flex;
        flex: 1;
        overflow: hidden;
        height: 0;
      }

      aside {
        width: 260px;
        border-right: 1px solid var(--border);
        background: var(--bg-sidebar);
        display: flex;
        flex-direction: column;
        min-width: 200px;
        max-width: 400px;
      }
      aside.resizing { pointer-events: none; user-select: none; }

      .aside-header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        font-weight: 600;
        color: var(--text-main);
      }

      .categories-list {
        flex: 1;
        overflow-y: auto;
      }
      .category-item {
        padding: 10px 16px;
        cursor: pointer;
        color: var(--text-main);
        border-left: 3px solid transparent;
      }
      .category-item.active {
        border-left-color: var(--accent);
        background: var(--accent-light);
        color: var(--accent);
      }
      .category-item:hover { background: rgba(255,255,255,0.05); }

      .resizer {
        width: 6px;
        cursor: col-resize;
        background: var(--border);
        flex-shrink: 0;
      }
      .resizer:hover { background: var(--accent); }

      .content-area {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        background: var(--bg-page);
      }

      .results-count { margin-bottom: 16px; color: var(--text-secondary); }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 16px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      }
      .card h3 { margin-bottom: 8px; color: var(--text-main); }
      .card .text { color: var(--text-secondary); line-height: 1.5; }

      .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
      .error { color: #ef4444; text-align: center; padding: 20px; }

      @media (max-width: 768px) {
        aside { width: 70px; padding: 0; }
        .categories-list { display: none; }
        .aside-header span { display: none; }
        main { flex-direction: column; }
        aside { border-right: none; border-bottom: 1px solid var(--border); }
        .resizer { display: none; }
      }
    </style>
  </head>
  <!-- По умолчанию ставим тёмную тему -->
  <body data-theme="dark">
    <header>
      <div style="font-weight:600; color:var(--accent);">WB База знаний</div>
      <div class="toolbar">
        <input type="search" id="searchInput" placeholder="Поиск шаблона..." />
        <button class="btn btn-outline" id="refreshBtn" title="Обновить данные">🔄 Обновить</button>
        <button class="btn btn-primary" id="themeToggle">Светлая тема</button>
      </div>
    </header>

    <main>
      <aside id="aside">
        <div class="aside-header"><span>Категории</span></div>
        <div class="categories-list" id="categoriesList"></div>
        <div class="resizer" id="resizer"></div>
      </aside>

      <div class="content-area">
        <div class="results-count" id="resultsCount">Загружено шаблонов: 0</div>
        <div id="templatesContainer"></div>
      </div>
    </main>

    <script>
      // !!! ВСТАВЬ СЮДА СВОЮ CSV ССЫЛКУ !!!
      // Она должна заканчиваться на /pub?output=csv
      const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQWriQhXiQaFnRHtBPiqIpBT1LUUF2-cBnsXJvu4OKP4zycIc4dLvjVZ1abiF-RrsvaeL2Sgw_ZSUcB/pub?output=csv';

      const categoriesListEl = document.getElementById('categoriesList');
      const templatesContainerEl = document.getElementById('templatesContainer');
      const searchInputEl = document.getElementById('searchInput');
      const refreshBtnEl = document.getElementById('refreshBtn');
      const themeToggleEl = document.getElementById('themeToggle');
      const asideEl = document.getElementById('aside');
      const resizerEl = document.getElementById('resizer');
      const resultsCountEl = document.getElementById('resultsCount');

      let templatesData = [];
      let currentCategory = null;

      async function loadTemplates() {
        refreshBtnEl.disabled = true;
        templatesContainerEl.innerHTML = '<div class="loading">Загрузка данных из таблицы…</div>';

        try {
          const response = await fetch(csvUrl);
          if (!response.ok) throw new Error('Ошибка сети или таблица недоступна');

          const text = await response.text();
          
          // Используем PapaParse для надежного парсинга CSV
          const result = Papa.parse(text, {
            header: true,
            skipEmptyLines: true
          });

          if (result.errors && result.errors.length > 0) {
            throw new Error('Ошибка парсинга CSV: ' + result.errors.message);
          }

          templatesData = result.data;

          // Проверка на правильный формат
          const firstRow = templatesData;
          if (!firstRow || !('category' in firstRow) || !('title' in firstRow) || !('text' in firstRow)) {
            throw new Error('Неверный формат CSV. Нужны колонки: category, title, text');
          }

          renderCategories();
          renderTemplates();
          resultsCountEl.textContent = `Загружено шаблонов: \${templatesData.length}`;
        } catch (error) {
          console.error(error);
          templatesContainerEl.innerHTML = `
            <div class="error">
              <strong>Ошибка загрузки:</strong> \${error.message}<br/>
              <small>Проверь, что таблица опубликована как CSV (а не HTML) и в первой строке есть колонки: category, title, text.</small>
            </div>`;
        } finally {
          refreshBtnEl.disabled = false;
        }
      }

      function renderCategories() {
        const categories = [...new Set(templatesData.map(t => t.category || 'Без категории'))];
        categoriesListEl.innerHTML = '';

        categories.forEach(cat => {
          const el = document.createElement('div');
          el.className = 'category-item' + (currentCategory === cat ? ' active' : '');
          el.textContent = cat;
          el.onclick = () => {
            currentCategory = cat;
            updateActiveCategory();
            renderTemplates();
          };
          categoriesListEl.appendChild(el);
        });
      }

      function updateActiveCategory() {
        const items = categoriesListEl.querySelectorAll('.category-item');
        items.forEach(el => {
          if (currentCategory && el.textContent === currentCategory) {
            el.classList.add('active');
          } else {
            el.classList.remove('active');
          }
        });
      }

      function filterTemplates(query, category) {
        return templatesData.filter(t => {
          const catMatch = !category || (t.category || '') === category;
          const q = query.toLowerCase();
          const titleMatch = (t.title || '').toLowerCase().includes(q);
          const textMatch = (t.text || '').toLowerCase().includes(q);
          return catMatch && (titleMatch || textMatch);
        });
      }

      function renderTemplates() {
        const query = searchInputEl.value.toLowerCase();
        const filtered = filterTemplates(query, currentCategory);

        templatesContainerEl.innerHTML = '';
        if (filtered.length === 0) {
          templatesContainerEl.innerHTML = '<div style="padding:20px;color:var(--text-secondary)">Ничего не найдено</div>';
          return;
        }

        filtered.forEach(t => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <h3>\${escapeHtml(t.title)}</h3>
            <div class="text">\${escapeHtml(t.text)}</div>
          `;
          templatesContainerEl.appendChild(card);
        });

        resultsCountEl.textContent = `Найдено: \${filtered.length}`;
      }

      function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      searchInputEl.addEventListener('input', renderTemplates);
      refreshBtnEl.addEventListener('click', loadTemplates);

      // Переключение темы
      themeToggleEl.addEventListener('click', () => {
        const body = document.body;
        const isDark = body.getAttribute('data-theme') === 'dark';
        
        if (isDark) {
          body.setAttribute('data-theme', 'light');
          themeToggleEl.textContent = 'Тёмная тема';
        } else {
          body.setAttribute('data-theme', 'dark');
          themeToggleEl.textContent = 'Светлая тема';
        }
      });

      // Ресайз боковой панели
      let isResizing = false;
      let startX, startWidth;

      resizerEl.addEventListener('mousedown', e => {
        isResizing = true;
        startX = e.clientX;
        startWidth = asideEl.offsetWidth;
        asideEl.classList.add('resizing');
        document.body.style.userSelect = 'none';
      });

      window.addEventListener('mousemove', e => {
        if (!isResizing) return;
        const dx = e.clientX - startX;
        const newWidth = Math.max(200, Math.min(400, startWidth + dx));
        asideEl.style.width = newWidth + 'px';
      });

      window.addEventListener('mouseup', () => {
        if (!isResizing) return;
        isResizing = false;
        asideEl.classList.remove('resizing');
        document.body.style.userSelect = '';
      });

      // Старт
      loadTemplates();
    </script>
  </body>
</html>
