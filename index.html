<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Hub — Космический менеджер шаблонов</title>
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #0d1117;
            --bg-card: #111827;
            --bg-hover: #1a2332;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --border: #1f2937;
            --shadow: rgba(0, 0, 0, 0.5);
            --gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            --star-color: #ffffff;
            --nebula-purple: rgba(139, 92, 246, 0.1);
            --nebula-blue: rgba(59, 130, 246, 0.1);
            --nebula-pink: rgba(236, 72, 153, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: var(--star-color);
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            opacity: var(--opacity);
        }

        @keyframes twinkle {
            0%, 100% { opacity: var(--opacity); }
            50% { opacity: calc(var(--opacity) * 0.3); }
        }

        .nebula {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            animation: nebulaFloat 20s ease-in-out infinite;
        }

        @keyframes nebulaFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        .app-container {
            display: flex;
            height: 100vh;
            position: relative;
            z-index: 1;
        }

        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 1.5em;
            font-weight: bold;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }

        .btn-new-template {
            width: 100%;
            padding: 12px;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: box-shadow 0.3s;
        }

        .btn-new-template:hover {
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
        }

        .categories-section {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            min-height: 0;
        }

        .categories-header {
            padding: 10px;
            font-size: 0.8em;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-add-category {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 1.2em;
            padding: 0 5px;
            transition: color 0.3s;
        }

        .btn-add-category:hover {
            color: var(--accent-hover);
        }

        .category-item {
            padding: 12px 15px;
            margin: 5px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
            display: flex;
            align-items: center;
            border: 2px solid transparent;
            min-height: 48px;
            overflow: hidden;
            width: 100%;
        }

        .category-item:hover {
            background: var(--bg-hover);
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.1);
        }

        .category-item.active {
            background: var(--bg-hover);
            border-color: var(--accent);
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.2);
        }

        .category-item.drag-over {
            border-color: var(--success);
            background: rgba(52, 211, 153, 0.1);
            box-shadow: 0 0 30px rgba(52, 211, 153, 0.3);
        }

        .category-item.dragging {
            opacity: 0.4;
        }

        .category-icon {
            margin-right: 10px;
            font-size: 1.2em;
            flex-shrink: 0;
            width: 24px;
            text-align: center;
        }

        .category-name {
            font-weight: 500;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
            display: block;
        }

        .category-count {
            background: var(--accent);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-left: 8px;
            min-width: 24px;
            text-align: center;
            flex-shrink: 0;
        }

        .category-actions {
            display: flex;
            gap: 2px;
            margin-left: 8px;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.2s;
            width: 68px;
            justify-content: flex-end;
        }

        .category-item:hover .category-actions {
            opacity: 1;
        }

        .btn-category-action {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            font-size: 0.8em;
            transition: color 0.3s;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-category-action:hover {
            color: var(--text-primary);
        }

        .btn-category-action.delete:hover {
            color: var(--danger);
        }

        .btn-category-action.move {
            cursor: grab;
        }

        .btn-category-action.move:active {
            cursor: grabbing;
        }

        .sidebar-footer {
            padding: 15px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn-icon {
            flex: 1;
            padding: 10px;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
            font-size: 0.9em;
        }

        .btn-icon:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        .main-header {
            padding: 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
        }

        .search-wrapper {
            flex: 1;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            background: var(--bg-primary);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1em;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn-header {
            padding: 10px 15px;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s;
        }

        .btn-header:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
        }

        .templates-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            align-content: start;
            min-height: 0;
        }

        .template-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: border-color 0.3s, box-shadow 0.3s, opacity 0.3s;
            border: 2px solid transparent;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .template-card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.2);
        }

        .template-card.dragging {
            opacity: 0.4;
        }

        .template-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
            gap: 10px;
        }

        .template-card-title {
            font-weight: bold;
            font-size: 1.1em;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .template-card-badge {
            background: var(--accent);
            color: white;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.75em;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .template-card-text {
            color: var(--text-secondary);
            line-height: 1.5;
            font-size: 0.9em;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .template-card-actions {
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .template-card:hover .template-card-actions {
            opacity: 1;
        }

        .btn-card-action {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            transition: box-shadow 0.3s;
            font-weight: 500;
        }

        .btn-copy {
            background: var(--success);
            color: #000;
        }

        .btn-edit {
            background: var(--accent);
            color: white;
        }

        .btn-delete {
            background: var(--danger);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-title {
            font-size: 1.5em;
            font-weight: bold;
        }

        .btn-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5em;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;
            padding: 12px;
            background: var(--bg-primary);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1em;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-textarea {
            min-height: 200px;
            resize: vertical;
        }

        .icon-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .icon-option {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            background: var(--bg-primary);
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .icon-option:hover {
            border-color: var(--accent);
            background: var(--bg-hover);
        }

        .icon-option.selected {
            border-color: var(--success);
            background: rgba(52, 211, 153, 0.1);
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.3);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary {
            background: var(--gradient);
            color: white;
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--success);
            color: #000;
            padding: 15px 20px;
            border-radius: 8px;
            font-weight: bold;
            transform: translateX(120%);
            transition: transform 0.5s;
            z-index: 3000;
        }

        .toast.show {
            transform: translateX(0);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-hover);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="stars-container" id="starsContainer"></div>
    <div class="nebula" style="width: 300px; height: 300px; background: var(--nebula-purple); top: 10%; left: 5%;"></div>
    <div class="nebula" style="width: 400px; height: 400px; background: var(--nebula-blue); bottom: 20%; right: 10%;"></div>
    
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">🌌 Template Hub</div>
                <button class="btn-new-template" onclick="openTemplateModal()">✨ Новый шаблон</button>
            </div>
            
            <div class="categories-section">
                <div class="categories-header">
                    <span>Категории</span>
                    <button class="btn-add-category" onclick="openCategoryModal()">+</button>
                </div>
                <div id="categoriesList"></div>
            </div>
            
            <div class="sidebar-footer">
                <button class="btn-icon" onclick="exportData()" title="Экспорт">📤</button>
                <button class="btn-icon" onclick="importData()" title="Импорт">📥</button>
                <button class="btn-icon" onclick="showRandomTemplate()" title="Случайный">🎲</button>
                <button class="btn-icon" onclick="clearAll()" title="Очистить">🗑️</button>
            </div>
        </div>
        
        <div class="main-content">
            <div class="main-header">
                <div class="search-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="searchInput" placeholder="Поиск шаблонов...">
                </div>
                <div class="header-actions">
                    <button class="btn-header" onclick="showStats()">📊</button>
                </div>
            </div>
            
            <div class="templates-container" id="templatesContainer"></div>
        </div>
    </div>
    
    <!-- Модальное окно шаблона -->
    <div class="modal" id="templateModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="templateModalTitle">Новый шаблон</h2>
                <button class="btn-close" onclick="closeModal('templateModal')">×</button>
            </div>
            
            <div class="form-group">
                <label class="form-label">Название</label>
                <input type="text" class="form-input" id="templateName">
            </div>
            
            <div class="form-group">
                <label class="form-label">Категория</label>
                <select class="form-select" id="templateCategory"></select>
            </div>
            
            <div class="form-group">
                <label class="form-label">Текст</label>
                <textarea class="form-textarea" id="templateText"></textarea>
            </div>
            
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="saveTemplate()">💾 Сохранить</button>
                <button class="btn btn-secondary" onclick="closeModal('templateModal')">Отмена</button>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно категории -->
    <div class="modal" id="categoryModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="categoryModalTitle">Новая категория</h2>
                <button class="btn-close" onclick="closeModal('categoryModal')">×</button>
            </div>
            
            <div class="form-group">
                <label class="form-label">Название категории</label>
                <input type="text" class="form-input" id="categoryName">
            </div>
            
            <div class="form-group">
                <label class="form-label">Выбери иконку</label>
                <div class="icon-picker" id="iconPicker"></div>
            </div>
            
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="saveCategory()">💾 Сохранить</button>
                <button class="btn btn-secondary" onclick="closeModal('categoryModal')">Отмена</button>
            </div>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>

    <script>
        // ============ ДОСТУПНЫЕ ИКОНКИ ============
        const AVAILABLE_ICONS = [
            '📁', '💬', '💳', '📦', '🔧', '🎯', '📞', '✉️', 
            '🌐', '⚙️', '💡', '🔥', '⭐', '🚀', '🎮', '📝',
            '🔒', '⚠️', '✅', '❌', '💎', '🎵', '📊', '🏠'
        ];
        
        let selectedIcon = '📁';
        
        function generateStars() {
            const container = document.getElementById('starsContainer');
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = (Math.random() * 2 + 1) + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.setProperty('--opacity', Math.random() * 0.7 + 0.3);
                container.appendChild(star);
            }
        }
        
        const STORAGE_KEY = 'templateHubData';
        let data = {
            templates: [],
            categories: [], // Теперь: [{name: 'Общее', icon: '💬'}, ...]
            stats: {},
            currentCategory: 'Все'
        };
        
        let editingTemplateId = null;
        let editingCategoryName = null;
        let draggedCategory = null;
        
        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    // Миграция старых данных
                    if (parsed.categories.length > 0 && typeof parsed.categories[0] === 'string') {
                        parsed.categories = parsed.categories.map((name, i) => ({
                            name: name,
                            icon: AVAILABLE_ICONS[i % AVAILABLE_ICONS.length]
                        }));
                    }
                    data = { ...data, ...parsed };
                } catch (e) {
                    initializeDefaultData();
                }
            } else {
                initializeDefaultData();
            }
        }
        
        function initializeDefaultData() {
            data.categories = [
                { name: 'Общее', icon: '💬' },
                { name: 'Оплата', icon: '💳' },
                { name: 'Доставка', icon: '📦' },
                { name: 'Техподдержка', icon: '🔧' }
            ];
            data.templates = [
                {
                    id: 't1',
                    name: 'Приветствие',
                    category: 'Общее',
                    text: 'Здравствуйте! Спасибо за обращение. Меня зовут [Имя]. Как я могу помочь?',
                    createdAt: Date.now()
                },
                {
                    id: 't2',
                    name: 'Прощание',
                    category: 'Общее',
                    text: 'Спасибо за обращение! Хорошего дня!',
                    createdAt: Date.now()
                }
            ];
            saveData();
        }
        
        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }
        
        function getCategoryIcon(categoryName) {
            const cat = data.categories.find(c => c.name === categoryName);
            return cat ? cat.icon : '📁';
        }
        
        function renderCategories() {
            const container = document.getElementById('categoriesList');
            container.innerHTML = '';
            
            // "Все"
            const allItem = document.createElement('div');
            allItem.className = 'category-item' + (data.currentCategory === 'Все' ? ' active' : '');
            allItem.innerHTML = `
                <span class="category-icon">🌌</span>
                <span class="category-name">Все</span>
                <span class="category-count">${data.templates.length}</span>
            `;
            allItem.onclick = () => {
                data.currentCategory = 'Все';
                saveData();
                renderCategories();
                renderTemplates();
            };
            container.appendChild(allItem);
            
            // Остальные категории
            data.categories.forEach(category => {
                const count = data.templates.filter(t => t.category === category.name).length;
                
                const item = document.createElement('div');
                item.className = 'category-item' + (data.currentCategory === category.name ? ' active' : '');
                item.draggable = true;
                item.innerHTML = `
                    <span class="category-icon">${category.icon}</span>
                    <span class="category-name">${escapeHtml(category.name)}</span>
                    <span class="category-count">${count}</span>
                    <div class="category-actions">
                        <button class="btn-category-action move" title="Перетащить">⠿</button>
                        <button class="btn-category-action" onclick="editCategory('${escapeHtml(category.name)}')">✏️</button>
                        <button class="btn-category-action delete" onclick="deleteCategory('${escapeHtml(category.name)}')">🗑️</button>
                    </div>
                `;
                
                item.onclick = (e) => {
                    if (e.target.closest('.category-actions')) return;
                    data.currentCategory = category.name;
                    saveData();
                    renderCategories();
                    renderTemplates();
                };
                
                item.addEventListener('dragstart', (e) => {
                    draggedCategory = category.name;
                    item.classList.add('dragging');
                });
                
                item.addEventListener('dragend', () => {
                    item.classList.remove('dragging');
                    draggedCategory = null;
                });
                
                item.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    item.classList.add('drag-over');
                });
                
                item.addEventListener('dragleave', () => {
                    item.classList.remove('drag-over');
                });
                
                item.addEventListener('drop', (e) => {
                    e.preventDefault();
                    item.classList.remove('drag-over');
                    if (draggedCategory && draggedCategory !== category.name) {
                        reorderCategories(draggedCategory, category.name);
                    } else {
                        const templateId = e.dataTransfer.getData('templateId');
                        if (templateId) moveTemplateToCategory(templateId, category.name);
                    }
                });
                
                container.appendChild(item);
            });
        }
        
        function reorderCategories(from, to) {
            const fromIndex = data.categories.findIndex(c => c.name === from);
            const toIndex = data.categories.findIndex(c => c.name === to);
            if (fromIndex !== -1 && toIndex !== -1 && fromIndex !== toIndex) {
                const [moved] = data.categories.splice(fromIndex, 1);
                data.categories.splice(toIndex, 0, moved);
                saveData();
                renderCategories();
                renderTemplates();
                showToast('Категории переставлены');
            }
        }
        
        function renderTemplates(searchTerm = '') {
            const container = document.getElementById('templatesContainer');
            container.innerHTML = '';
            
            let filtered = data.templates;
            if (data.currentCategory !== 'Все') {
                filtered = filtered.filter(t => t.category === data.currentCategory);
            }
            if (searchTerm) {
                filtered = filtered.filter(t => 
                    t.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    t.text.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🌠</div><h3>Нет шаблонов</h3></div>';
                return;
            }
            
            filtered.forEach(template => {
                const icon = getCategoryIcon(template.category);
                const card = document.createElement('div');
                card.className = 'template-card';
                card.draggable = true;
                card.innerHTML = `
                    <div class="template-card-header">
                        <span class="template-card-title">${icon} ${escapeHtml(template.name)}</span>
                        <span class="template-card-badge">${escapeHtml(template.category)}</span>
                    </div>
                    <div class="template-card-text">${escapeHtml(template.text)}</div>
                    <div class="template-card-actions">
                        <button class="btn-card-action btn-copy" onclick="copyTemplate('${template.id}')">📋 Копировать</button>
                        <button class="btn-card-action btn-edit" onclick="editTemplate('${template.id}')">✏️</button>
                        <button class="btn-card-action btn-delete" onclick="deleteTemplate('${template.id}')">🗑️</button>
                    </div>
                `;
                
                card.addEventListener('dblclick', () => copyTemplate(template.id));
                card.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('templateId', template.id);
                    card.classList.add('dragging');
                });
                card.addEventListener('dragend', () => card.classList.remove('dragging'));
                
                container.appendChild(card);
            });
        }
        
        function openTemplateModal(templateId = null) {
            editingTemplateId = templateId;
            document.getElementById('templateModalTitle').textContent = templateId ? 'Редактировать шаблон' : 'Новый шаблон';
            
            const select = document.getElementById('templateCategory');
            select.innerHTML = '';
            data.categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat.name;
                option.textContent = cat.icon + ' ' + cat.name;
                select.appendChild(option);
            });
            
            if (templateId) {
                const template = data.templates.find(t => t.id === templateId);
                document.getElementById('templateName').value = template.name;
                document.getElementById('templateCategory').value = template.category;
                document.getElementById('templateText').value = template.text;
            } else {
                document.getElementById('templateName').value = '';
                document.getElementById('templateCategory').value = data.currentCategory !== 'Все' ? data.currentCategory : data.categories[0]?.name;
                document.getElementById('templateText').value = '';
            }
            
            document.getElementById('templateModal').classList.add('active');
        }
        
        function editTemplate(templateId) {
            openTemplateModal(templateId);
        }
        
        function saveTemplate() {
            const name = document.getElementById('templateName').value.trim();
            const category = document.getElementById('templateCategory').value;
            const text = document.getElementById('templateText').value.trim();
            
            if (!name || !text) {
                showToast('Заполните название и текст', 'error');
                return;
            }
            
            if (editingTemplateId) {
                const template = data.templates.find(t => t.id === editingTemplateId);
                template.name = name;
                template.category = category;
                template.text = text;
            } else {
                data.templates.push({
                    id: 't' + Date.now(),
                    name: name,
                    category: category,
                    text: text,
                    createdAt: Date.now()
                });
            }
            
            saveData();
            closeModal('templateModal');
            renderCategories();
            renderTemplates();
            showToast('Шаблон сохранён');
        }
        
        function deleteTemplate(templateId) {
            const template = data.templates.find(t => t.id === templateId);
            if (confirm(`Удалить "${template.name}"?`)) {
                data.templates = data.templates.filter(t => t.id !== templateId);
                saveData();
                renderCategories();
                renderTemplates();
                showToast('Шаблон удалён');
            }
        }
        
        function copyTemplate(templateId) {
            const template = data.templates.find(t => t.id === templateId);
            if (navigator.clipboard) {
                navigator.clipboard.writeText(template.text).then(() => {
                    showToast('Текст скопирован!');
                    data.stats[templateId] = (data.stats[templateId] || 0) + 1;
                    saveData();
                });
            }
        }
        
        function moveTemplateToCategory(templateId, newCategory) {
            const template = data.templates.find(t => t.id === templateId);
            if (template && template.category !== newCategory) {
                template.category = newCategory;
                saveData();
                renderCategories();
                renderTemplates();
                showToast(`Перемещено в "${newCategory}"`);
            }
        }
        
        function renderIconPicker() {
            const container = document.getElementById('iconPicker');
            container.innerHTML = '';
            
            AVAILABLE_ICONS.forEach(icon => {
                const div = document.createElement('div');
                div.className = 'icon-option' + (icon === selectedIcon ? ' selected' : '');
                div.textContent = icon;
                div.onclick = () => {
                    selectedIcon = icon;
                    renderIconPicker();
                };
                container.appendChild(div);
            });
        }
        
        function openCategoryModal(categoryName = null) {
            editingCategoryName = categoryName;
            document.getElementById('categoryModalTitle').textContent = categoryName ? 'Редактировать категорию' : 'Новая категория';
            document.getElementById('categoryName').value = categoryName || '';
            
            if (categoryName) {
                const cat = data.categories.find(c => c.name === categoryName);
                selectedIcon = cat ? cat.icon : '📁';
            } else {
                selectedIcon = '📁';
            }
            
            renderIconPicker();
            document.getElementById('categoryModal').classList.add('active');
        }
        
        function editCategory(categoryName) {
            openCategoryModal(categoryName);
        }
        
        function saveCategory() {
            const name = document.getElementById('categoryName').value.trim();
            if (!name) return;
            
            if (editingCategoryName) {
                const cat = data.categories.find(c => c.name === editingCategoryName);
                if (cat) {
                    cat.name = name;
                    cat.icon = selectedIcon;
                    data.templates.forEach(t => {
                        if (t.category === editingCategoryName) t.category = name;
                    });
                }
            } else {
                if (data.categories.some(c => c.name === name)) {
                    showToast('Такая категория уже есть', 'error');
                    return;
                }
                data.categories.push({ name: name, icon: selectedIcon });
            }
            
            saveData();
            closeModal('categoryModal');
            renderCategories();
            renderTemplates();
            showToast('Категория сохранена');
        }
        
        function deleteCategory(categoryName) {
            if (confirm(`Удалить категорию "${categoryName}"?`)) {
                data.categories = data.categories.filter(c => c.name !== categoryName);
                data.templates.forEach(t => {
                    if (t.category === categoryName) t.category = 'Общее';
                });
                if (!data.categories.some(c => c.name === 'Общее')) {
                    data.categories.unshift({ name: 'Общее', icon: '💬' });
                }
                if (data.currentCategory === categoryName) data.currentCategory = 'Все';
                saveData();
                renderCategories();
                renderTemplates();
                showToast('Категория удалена');
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }
        
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.background = type === 'success' ? 'var(--success)' : 'var(--danger)';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
        
        function showRandomTemplate() {
            if (data.templates.length === 0) return;
            const random = data.templates[Math.floor(Math.random() * data.templates.length)];
            copyTemplate(random.id);
        }
        
        function showStats() {
            alert(`📊 Статистика:\n\n📝 Шаблонов: ${data.templates.length}\n📁 Категорий: ${data.categories.length}\n📋 Копирований: ${Object.values(data.stats).reduce((a, b) => a + b, 0)}`);
        }
        
        function exportData() {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'template_hub_backup.json';
            a.click();
            showToast('Экспортировано');
        }
        
        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        data = imported;
                        saveData();
                        renderCategories();
                        renderTemplates();
                        showToast('Импортировано');
                    } catch (error) {
                        showToast('Ошибка импорта', 'error');
                    }
                };
                reader.readAsText(e.target.files[0]);
            };
            input.click();
        }
        
        function clearAll() {
            if (confirm('Удалить ВСЁ?')) {
                data.templates = [];
                data.categories = [{ name: 'Общее', icon: '💬' }];
                data.stats = {};
                data.currentCategory = 'Все';
                saveData();
                renderCategories();
                renderTemplates();
            }
        }
        
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderTemplates(e.target.value);
        });
        
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.remove('active');
            });
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
            }
        });
        
        generateStars();
        loadData();
        renderCategories();
        renderTemplates();
    </script>
</body>
</html>
