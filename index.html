<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>База знаний поддержки</title>
    <style>
        /* === Базовые настройки === */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
            background: #f3e8ff;
            color: #1e1b4b;
        }

        /* === Сайдбар (Скелет) === */
        .sidebar {
            width: 280px;
            background: #7c3aed;
            color: #ede9fe;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #c4b5fd;
            height: 100vh;
            flex-shrink: 0;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- Логика сворачивания (ИСПРАВЛЕНО) --- */
        .sidebar.collapsed {
            width: 60px !important;
            overflow: hidden;
        }
        .sidebar.collapsed h2, 
        .sidebar.collapsed .theme-scroll, 
        .sidebar.collapsed #searchInput, 
        .sidebar.collapsed .dark-toggle {
            display: none;
        }
        .sidebar.collapsed #toggleSidebar {
            justify-content: center;
        }
        .sidebar.collapsed .refresh-btn {
            width: 100%;
            text-align: center;
            padding: 10px;
            font-size: 12px;
        }
        /* -------------------------------------- */

        .sidebar h2 {
            font-size: 22px;
            margin-bottom: 15px;
            border-bottom: 2px solid #8b5cf6;
            padding-bottom: 15px;
            color: #ede9fe;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        #searchInput {
            width: 100%;
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            background: #ede9fe;
            color: #1e1b4b;
            font-size: 15px;
            outline: none;
            margin-bottom: 15px;
        }

        .theme-scroll {
            flex: 1;
            overflow-y: auto;
        }

        .theme-btn {
            display: block;
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 6px;
            background: transparent;
            color: #ede9fe;
            border: none;
            border-radius: 8px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
        }
        .theme-btn:hover { background: rgba(255,255,255,0.15); }

        .dark-toggle {
            padding: 8px;
            border: 2px solid #c4b5fd;
            border-radius: 8px;
            background: transparent;
            color: #ede9fe;
            font-size: 13px;
            cursor: pointer;
            margin-top: 10px;
        }

        .refresh-btn {
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 8px;
            color: #ede9fe;
            font-size: 13px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* === Контент (Скелет) === */
        .content {
            flex: 1;
            padding: 30px 40px;
            overflow: hidden;
            background: #f3e8ff;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .content-header { margin-bottom: 20px; }
        .content h1 { font-size: 26px; color: #1e1b4b; margin-bottom: 6px; }
        .subtitle { color: #4c1d95; font-size: 15px; }

        .templates-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* === Карточки (Скелет) === */
        .template-card {
            background: #ffffff;
            border-left: 5px solid #7c3aed;
            padding: 20px 24px;
            margin-bottom: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }
        .template-text {
            font-size: 15px;
            line-height: 1.6;
            color: #1e1b4b;
            white-space: pre-wrap;
            flex: 1;
        }
        .template-text strong { color: #7c3aed; }

        .template-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
            flex-shrink: 0;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid #c4b5fd;
            color: #1e1b4b;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .copy-btn:hover {
            background: #7c3aed;
            color: white;
            border-color: #7c3aed;
        }

        /* === Блок ошибки (ИСПРАВЛЕНО) === */
        .error-container {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .error-title { font-weight: bold; display: block; margin-bottom: 4px; }

        /* === Кнопка сворачивания (ИСПРАВЛЕНО) === */
        #toggleSidebar {
            cursor: pointer;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #ede9fe;
        }
        #toggleSidebar:hover { background: rgba(255,255,255,0.1); }
        .sidebar.collapsed #toggleSidebar span { display: none; }
    </style>
</head>
<body>

    <!-- Сайдбар (Скелет) -->
    <aside class="sidebar" id="sidebar">
        <h2>
            Темы
            <button id="toggleSidebar" onclick="toggleSidebar()">
                <span id="toggleText">Свернуть</span>
            </button>
        </h2>

        <input type="text" id="searchInput" placeholder="Поиск по шаблонам...">

        <div class="theme-scroll">
            <button class="theme-btn active">Фиолет</button>
            <button class="theme-btn">WB</button>
        </div>

        <button class="dark-toggle">Ночной режим</button>
        <button class="refresh-btn" onclick="loadData()">Обновить данные</button>
    </aside>

    <!-- Контент (Скелет) -->
    <main class="content">
        <div class="content-header">
            <h1>База знаний поддержки</h1>
            <div class="subtitle">Шаблоны ответов и инструкции</div>
        </div>

        <!-- Блок ошибки (теперь он пустой по умолчанию и появляется только при ошибке) -->
        <div class="error-container" id="errorBox">
            <span class="error-title" id="errorTitle">Ошибка</span>
            <span id="errorMessage">Подробности ошибки</span>
        </div>

        <div class="templates-scroll" id="templatesContainer">
            <p style="color: #4c1d95; margin-top: 20px; text-align: center;">Загрузка данных...</p>
        </div>
    </main>

    <script>
        // ================= ИСПРАВЛЕНИЕ КНОПКИ (ТОЛЬКО ЭТО) =================
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const toggleText = document.getElementById('toggleText');
            
            // toggle добавляет класс, если его нет, и удаляет, если есть
            sidebar.classList.toggle('collapsed');
            
            // Меняем текст кнопки
            if (sidebar.classList.contains('collapsed')) {
                toggleText.textContent = 'Развернуть';
            } else {
                toggleText.textContent = 'Свернуть';
            }
        }
        // ===================================================================

        // ================= ЗАГРУЗКА ДАННЫХ (МОК-ДАННЫЕ) =================
        async function loadData() {
            const container = document.getElementById('templatesContainer');
            const errorBox = document.getElementById('errorBox');
            const errorTitle = document.getElementById('errorTitle');
            const errorMessage = document.getElementById('errorMessage');

            // 1. Скрываем старую ошибку
            errorBox.style.display = 'none';
            container.innerHTML = '<p style="color: #4c1d95; margin-top: 20px; text-align: center;">Загрузка данных...</p>';

            try {
                // Имитация запроса (замени этот блок на свой реальный fetch)
                const response = await new Promise((resolve, reject) => {
                    setTimeout(() => {
                        resolve({
                            ok: true,
                            json: () => Promise.resolve([
                                { id: 1, title: "Возврат товара", text: "Здравствуйте! Спасибо за обращение. Для оформления возврата, пожалуйста, уточните номер заказа." },
                                { id: 2, title: "Задержка доставки", text: "Приносим извинения за задержку. Мы уже связались с курьерской службой для уточнения сроков." },
                                { id: 3, title: "Неверный размер", text: "Если размер не подошел, вы можете оформить возврат в течение 14 дней с момента получения." }
                            ])
                        });
                    }, 500); 
                });

                if (!response.ok) throw new Error("Ошибка сети");

                const data = await response.json();
                renderTemplates(data);

            } catch (error) {
                console.error(error);
                
                // 2. ИСПРАВЛЕНИЕ ОШИБКИ: Берем реальный текст ошибки, а не шаблон
                const errMsg = error.message || "Произошла неизвестная ошибка";
                
                errorTitle.textContent = "Ошибка подключения";
                errorMessage.textContent = errMsg;
                errorBox.style.display = 'block';
                
                container.innerHTML = '';
            }
        }

        function renderTemplates(data) {
            const container = document.getElementById('templatesContainer');
            container.innerHTML = '';

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'template-card';
                // Здесь данные подставляются корректно
                card.innerHTML = `
                    <div class="template-text">
                        <strong>\${item.title}</strong>
                        <br><br>
                        \${item.text}
                    </div>
                    <div class="template-actions">
                        <button class="copy-btn" onclick="copyText(this, '\${item.text.replace(/"/g, '&quot;')}')" title="Копировать">Копировать</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function copyText(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.textContent;
                btn.textContent = "Скопировано!";
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            });
        }

        // Запуск при загрузке
        loadData();
    </script>
</body>
</html>
