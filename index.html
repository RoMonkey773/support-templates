<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Hub — Космический менеджер шаблонов</title>
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #0d1117;
            --bg-card: #111827;
            --bg-hover: #1a2332;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --border: #1f2937;
            --shadow: rgba(0, 0, 0, 0.5);
            --gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            --star-color: #ffffff;
            --nebula-purple: rgba(139, 92, 246, 0.1);
            --nebula-blue: rgba(59, 130, 246, 0.1);
            --nebula-pink: rgba(236, 72, 153, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: var(--star-color);
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            opacity: var(--opacity);
        }

        @keyframes twinkle {
            0%, 100% { opacity: var(--opacity); }
            50% { opacity: calc(var(--opacity) * 0.3); }
        }

        .nebula {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            animation: nebulaFloat 20s ease-in-out infinite;
        }

        @keyframes nebulaFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        .app-container {
            display: flex;
            height: 100vh;
            position: relative;
            z-index: 1;
        }

        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 1.5em;
            font-weight: bold;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }

        .btn-new-template {
            width: 100%;
            padding: 12px;
            background: var(--gradient);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .categories-section {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .categories-header {
            padding: 10px;
            font-size: 0.8em;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        .btn-add-category {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 1.2em;
        }

        .category-item {
            padding: 12px 15px;
            margin: 5px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            border: 2px solid transparent;
        }

        .category-item:hover {
            background: var(--bg-hover);
        }

        .category-item.active {
            background: var(--bg-hover);
            border-color: var(--accent);
        }

        .category-name {
            font-weight: 500;
        }

        .category-count {
            background: var(--accent);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-left: 8px;
        }

        .sidebar-footer {
            padding: 15px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            flex: 1;
            padding: 10px;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .main-header {
            padding: 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .search-input {
            flex: 1;
            padding: 12px;
            background: var(--bg-primary);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1em;
        }

        .templates-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            align-content: start;
        }

        .template-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            border: 2px solid transparent;
            transition: border-color 0.3s;
        }

        .template-card:hover {
            border-color: var(--accent);
        }

        .template-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .template-card-title {
            font-weight: bold;
            font-size: 1.1em;
        }

        .template-card-category {
            background: var(--accent);
            color: white;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.75em;
        }

        .template-card-text {
            color: var(--text-secondary);
            line-height: 1.5;
            font-size: 0.9em;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 15px;
        }

        /* Секция выбора комбинации */
        .shortcut-section {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .shortcut-select {
            padding: 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.85em;
        }

        .shortcut-badge {
            background: var(--success);
            color: #000;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.75em;
            font-weight: bold;
        }

        .template-card-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-card-action {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            transition: opacity 0.3s;
        }

        .btn-copy {
            background: var(--success);
            color: #000;
        }

        .btn-edit {
            background: var(--accent);
            color: white;
        }

        .btn-delete {
            background: var(--danger);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            border: 1px solid var(--border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-title {
            font-size: 1.5em;
            font-weight: bold;
        }

        .btn-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5em;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;
            padding: 12px;
            background: var(--bg-primary);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1em;
        }

        .form-textarea {
            min-height: 150px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary {
            background: var(--gradient);
            color: white;
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--success);
            color: #000;
            padding: 15px 20px;
            border-radius: 8px;
            font-weight: bold;
            transform: translateX(120%);
            transition: transform 0.5s;
            z-index: 3000;
        }

        .toast.show {
            transform: translateX(0);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-hover);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="stars-container" id="starsContainer"></div>
    <div class="nebula" style="width: 300px; height: 300px; background: var(--nebula-purple); top: 10%; left: 5%;"></div>
    <div class="nebula" style="width: 400px; height: 400px; background: var(--nebula-blue); bottom: 20%; right: 10%;"></div>
    
    <div class="app-container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">🌌 Template Hub</div>
                <button class="btn-new-template" onclick="openTemplateModal()">✨ Новый шаблон</button>
            </div>
            
            <div class="categories-section">
                <div class="categories-header">
                    <span>Категории</span>
                    <button class="btn-add-category" onclick="openCategoryModal()">+</button>
                </div>
                <div id="categoriesList"></div>
            </div>
            
            <div class="sidebar-footer">
                <button class="btn-icon" onclick="exportData()">📤</button>
                <button class="btn-icon" onclick="importData()">📥</button>
                <button class="btn-icon" onclick="showRandomTemplate()">🎲</button>
                <button class="btn-icon" onclick="clearAll()">🗑️</button>
            </div>
        </div>
        
        <!-- MAIN CONTENT -->
        <div class="main-content">
            <div class="main-header">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 Поиск шаблонов...">
            </div>
            
            <div class="templates-container" id="templatesContainer"></div>
        </div>
    </div>
    
    <!-- TEMPLATE MODAL -->
    <div class="modal" id="templateModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="templateModalTitle">Новый шаблон</h2>
                <button class="btn-close" onclick="closeModal('templateModal')">×</button>
            </div>
            
            <div class="form-group">
                <label class="form-label">Название</label>
                <input type="text" class="form-input" id="templateName">
            </div>
            
            <div class="form-group">
                <label class="form-label">Категория</label>
                <select class="form-select" id="templateCategory"></select>
            </div>
            
            <div class="form-group">
                <label class="form-label">Текст</label>
                <textarea class="form-textarea" id="templateText"></textarea>
            </div>
            
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="saveTemplate()">💾 Сохранить</button>
                <button class="btn btn-secondary" onclick="closeModal('templateModal')">Отмена</button>
            </div>
        </div>
    </div>
    
    <!-- CATEGORY MODAL -->
    <div class="modal" id="categoryModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="categoryModalTitle">Новая категория</h2>
                <button class="btn-close" onclick="closeModal('categoryModal')">×</button>
            </div>
            
            <div class="form-group">
                <label class="form-label">Название категории</label>
                <input type="text" class="form-input" id="categoryName">
            </div>
            
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="saveCategory()">💾 Сохранить</button>
                <button class="btn btn-secondary" onclick="closeModal('categoryModal')">Отмена</button>
            </div>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>

    <script>
        // ============ STARS ============
        function generateStars() {
            const container = document.getElementById('starsContainer');
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = (Math.random() * 2 + 1) + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.setProperty('--opacity', Math.random() * 0.7 + 0.3);
                container.appendChild(star);
            }
        }
        
        // ============ SHORTCUTS ============
        const AVAILABLE_SHORTCUTS = [
            'Alt+1', 'Alt+2', 'Alt+3', 'Alt+4', 'Alt+5', 'Alt+6', 'Alt+7', 'Alt+8', 'Alt+9',
            'Alt+Q', 'Alt+W', 'Alt+E', 'Alt+R', 'Alt+T', 'Alt+Y', 'Alt+U', 'Alt+I', 'Alt+O', 'Alt+P',
            'Alt+A', 'Alt+S', 'Alt+D', 'Alt+F', 'Alt+G', 'Alt+H', 'Alt+J', 'Alt+K', 'Alt+L',
            'Alt+Z', 'Alt+X', 'Alt+C', 'Alt+V', 'Alt+B', 'Alt+N', 'Alt+M'
        ];
        
        // ============ DATA ============
        const STORAGE_KEY = 'templateHubData';
        let data = {
            templates: [],
            categories: ['Общее', 'Оплата', 'Доставка', 'Техническая поддержка'],
            stats: {},
            currentCategory: 'Все'
        };
        
        let editingTemplateId = null;
        let editingCategoryName = null;
        
        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    data = { ...data, ...JSON.parse(saved) };
                } catch (e) {
                    initializeDefaultData();
                }
            } else {
                initializeDefaultData();
            }
        }
        
        function initializeDefaultData() {
            data.templates = [
                {
                    id: 't1',
                    name: 'Приветствие клиента',
                    category: 'Общее',
                    text: 'Здравствуйте! Спасибо, что обратились в нашу поддержку. Меня зовут [Имя]. Подскажите, пожалуйста, номер вашего заказа или email.',
                    shortcut: 'Alt+1'
                },
                {
                    id: 't2',
                    name: 'Прощание',
                    category: 'Общее',
                    text: 'Спасибо за обращение! Если у вас появятся ещё вопросы — пишите, мы всегда на связи. Хорошего дня!',
                    shortcut: 'Alt+2'
                },
                {
                    id: 't3',
                    name: 'Проблема с оплатой',
                    category: 'Оплата',
                    text: 'Понимаю ваше беспокойство. Давайте разберёмся с оплатой. Пожалуйста, пришлите скриншот ошибки или номер транзакции.',
                    shortcut: 'Alt+3'
                }
            ];
            saveData();
        }
        
        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }
        
        // ============ RENDER ============
        function renderCategories() {
            const container = document.getElementById('categoriesList');
            container.innerHTML = '';
            
            const allItem = document.createElement('div');
            allItem.className = 'category-item' + (data.currentCategory === 'Все' ? ' active' : '');
            allItem.innerHTML = `<span class="category-name">🌌 Все</span><span class="category-count">${data.templates.length}</span>`;
            allItem.onclick = () => { data.currentCategory = 'Все'; renderCategories(); renderTemplates(); };
            container.appendChild(allItem);
            
            data.categories.forEach(category => {
                const count = data.templates.filter(t => t.category === category).length;
                const item = document.createElement('div');
                item.className = 'category-item' + (data.currentCategory === category ? ' active' : '');
                item.innerHTML = `<span class="category-name">📁 ${category}</span><span class="category-count">${count}</span>`;
                item.onclick = () => { data.currentCategory = category; renderCategories(); renderTemplates(); };
                container.appendChild(item);
            });
        }
        
        function renderTemplates(searchTerm = '') {
            const container = document.getElementById('templatesContainer');
            container.innerHTML = '';
            
            let filtered = data.templates;
            if (data.currentCategory !== 'Все') {
                filtered = filtered.filter(t => t.category === data.currentCategory);
            }
            if (searchTerm) {
                filtered = filtered.filter(t => 
                    t.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    t.text.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state"><h3>Нет шаблонов</h3></div>';
                return;
            }
            
            filtered.forEach(template => {
                const card = document.createElement('div');
                card.className = 'template-card';
                
                // Build shortcut select options
                let shortcutOptions = '<option value="">Без клавиши</option>';
                AVAILABLE_SHORTCUTS.forEach(sc => {
                    const taken = data.templates.some(t => t.shortcut === sc && t.id !== template.id);
                    shortcutOptions += `<option value="${sc}" ${template.shortcut === sc ? 'selected' : ''} ${taken ? 'disabled' : ''}>${sc}${taken ? ' (занято)' : ''}</option>`;
                });
                
                card.innerHTML = `
                    <div class="template-card-header">
                        <span class="template-card-title">${escapeHtml(template.name)}</span>
                        <span class="template-card-category">${escapeHtml(template.category)}</span>
                    </div>
                    
                    <div class="shortcut-section">
                        <label style="font-size: 0.85em; color: var(--text-secondary);">⌨️ Клавиша:</label>
                        <select class="shortcut-select" onchange="changeShortcut('${template.id}', this.value)">
                            ${shortcutOptions}
                        </select>
                        ${template.shortcut ? `<span class="shortcut-badge">${template.shortcut}</span>` : ''}
                    </div>
                    
                    <div class="template-card-text">${escapeHtml(template.text)}</div>
                    
                    <div class="template-card-actions">
                        <button class="btn-card-action btn-copy" onclick="copyTemplate('${template.id}')">📋 Копировать</button>
                        <button class="btn-card-action btn-edit" onclick="editTemplate('${template.id}')">✏️</button>
                        <button class="btn-card-action btn-delete" onclick="deleteTemplate('${template.id}')">🗑️</button>
                    </div>
                `;
                
                card.addEventListener('dblclick', () => copyTemplate(template.id));
                container.appendChild(card);
            });
        }
        
        // ============ SHORTCUT CHANGE ============
        function changeShortcut(templateId, shortcut) {
            const template = data.templates.find(t => t.id === templateId);
            if (template) {
                template.shortcut = shortcut || null;
                saveData();
                renderTemplates(document.getElementById('searchInput').value);
                if (shortcut) {
                    showToast(`Клавиша ${shortcut} назначена`);
                } else {
                    showToast('Клавиша убрана');
                }
            }
        }
        
        // ============ CRUD ============
        function openTemplateModal(templateId = null) {
            editingTemplateId = templateId;
            const modal = document.getElementById('templateModal');
            const title = document.getElementById('templateModalTitle');
            
            const select = document.getElementById('templateCategory');
            select.innerHTML = '';
            data.categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                select.appendChild(option);
            });
            
            if (templateId) {
                const template = data.templates.find(t => t.id === templateId);
                title.textContent = 'Редактировать шаблон';
                document.getElementById('templateName').value = template.name;
                document.getElementById('templateCategory').value = template.category;
                document.getElementById('templateText').value = template.text;
            } else {
                title.textContent = 'Новый шаблон';
                document.getElementById('templateName').value = '';
                document.getElementById('templateCategory').value = data.categories[0];
                document.getElementById('templateText').value = '';
            }
            
            modal.classList.add('active');
        }
        
        function editTemplate(templateId) {
            openTemplateModal(templateId);
        }
        
        function saveTemplate() {
            const name = document.getElementById('templateName').value.trim();
            const category = document.getElementById('templateCategory').value;
            const text = document.getElementById('templateText').value.trim();
            
            if (!name || !text) {
                showToast('Заполните название и текст', 'error');
                return;
            }
            
            if (editingTemplateId) {
                const template = data.templates.find(t => t.id === editingTemplateId);
                template.name = name;
                template.category = category;
                template.text = text;
            } else {
                data.templates.push({
                    id: 't' + Date.now(),
                    name: name,
                    category: category,
                    text: text,
                    shortcut: null
                });
            }
            
            saveData();
            closeModal('templateModal');
            renderCategories();
            renderTemplates();
            showToast('Шаблон сохранён');
        }
        
        function deleteTemplate(templateId) {
            const template = data.templates.find(t => t.id === templateId);
            if (confirm(`Удалить "${template.name}"?`)) {
                data.templates = data.templates.filter(t => t.id !== templateId);
                saveData();
                renderCategories();
                renderTemplates();
            }
        }
        
        function copyTemplate(templateId) {
            const template = data.templates.find(t => t.id === templateId);
            navigator.clipboard.writeText(template.text).then(() => {
                showToast(`Скопировано: ${template.name}`);
                data.stats[templateId] = (data.stats[templateId] || 0) + 1;
                saveData();
            });
        }
        
        // ============ CATEGORIES ============
        function openCategoryModal(categoryName = null) {
            editingCategoryName = categoryName;
            document.getElementById('categoryModalTitle').textContent = categoryName ? 'Переименовать' : 'Новая категория';
            document.getElementById('categoryName').value = categoryName || '';
            document.getElementById('categoryModal').classList.add('active');
        }
        
        function saveCategory() {
            const name = document.getElementById('categoryName').value.trim();
            if (!name) return;
            
            if (editingCategoryName) {
                const index = data.categories.indexOf(editingCategoryName);
                if (index !== -1) {
                    data.categories[index] = name;
                    data.templates.forEach(t => {
                        if (t.category === editingCategoryName) t.category = name;
                    });
                }
            } else {
                if (!data.categories.includes(name)) {
                    data.categories.push(name);
                }
            }
            
            saveData();
            closeModal('categoryModal');
            renderCategories();
            renderTemplates();
        }
        
        function deleteCategory(categoryName) {
            if (confirm(`Удалить категорию "${categoryName}"?`)) {
                data.categories = data.categories.filter(c => c !== categoryName);
                data.templates.forEach(t => {
                    if (t.category === categoryName) t.category = 'Общее';
                });
                saveData();
                renderCategories();
                renderTemplates();
            }
        }
        
        // ============ UTILS ============
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }
        
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.background = type === 'success' ? 'var(--success)' : 'var(--danger)';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
        
        function showRandomTemplate() {
            if (data.templates.length === 0) return;
            const random = data.templates[Math.floor(Math.random() * data.templates.length)];
            copyTemplate(random.id);
        }
        
        function exportData() {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'template_hub_backup.json';
            a.click();
        }
        
        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        data = imported;
                        saveData();
                        renderCategories();
                        renderTemplates();
                        showToast('Импортировано');
                    } catch (error) {
                        showToast('Ошибка импорта', 'error');
                    }
                };
                reader.readAsText(e.target.files[0]);
            };
            input.click();
        }
        
        function clearAll() {
            if (confirm('Удалить ВСЁ?')) {
                data.templates = [];
                data.categories = ['Общее'];
                data.stats = {};
                saveData();
                renderCategories();
                renderTemplates();
            }
        }
        
        // ============ KEYBOARD SHORTCUTS ============
        document.addEventListener('keydown', (e) => {
            // Ignore if typing
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
                return;
            }
            
            const parts = [];
            if (e.ctrlKey) parts.push('Ctrl');
            if (e.altKey) parts.push('Alt');
            if (e.shiftKey) parts.push('Shift');
            if (e.key.length === 1) parts.push(e.key.toUpperCase());
            
            const shortcut = parts.join('+');
            const template = data.templates.find(t => t.shortcut === shortcut);
            
            if (template && (e.altKey || e.ctrlKey)) {
                e.preventDefault();
                copyTemplate(template.id);
            }
            
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
            }
        });
        
        // ============ INIT ============
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderTemplates(e.target.value);
        });
        
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.remove('active');
            });
        });
        
        generateStars();
        loadData();
        renderCategories();
        renderTemplates();
    </script>
</body>
</html>
