<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>База знаний поддержки</title>
    <style>
      :root {
        --bg-page: #f5f7fa;
        --bg-sidebar: #ffffff;
        --text-main: #1a1b1e;
        --text-secondary: #6b7280;
        --border: #e5e7eb;
        --accent: #7c3aed;
        --accent-hover: #5b21ba;
      }

      [data-theme="dark"] {
        --bg-page: #111827;
        --bg-sidebar: #1f2937;
        --text-main: #f3f4f6;
        --text-secondary: #9ca3af;
        --border: #374151;
        --accent: #8b5cf6;
        --accent-hover: #7835c9;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        background-color: var(--bg-page);
        color: var(--text-main);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--bg-sidebar);
        z-index: 10;
      }

      .toolbar { display: flex; gap: 12px; align-items: center; }

      input[type="search"] {
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg-sidebar);
        color: var(--text-main);
        min-width: 220px;
      }
      input[type="search"]:focus { outline: 2px solid var(--accent); }

      button.btn {
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.2s;
      }
      .btn-primary { background: var(--accent); color: white; }
      .btn-primary:hover { background: var(--accent-hover); }
      .btn-outline {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-main);
      }
      .btn-outline:hover { border-color: var(--accent); }
      .btn:disabled { opacity: 0.6; cursor: not-allowed; }

      main {
        display: flex;
        flex: 1;
        overflow: hidden;
        height: 0;
      }

      aside {
        width: 260px;
        border-right: 1px solid var(--border);
        background: var(--bg-sidebar);
        display: flex;
        flex-direction: column;
        min-width: 200px;
        max-width: 400px;
      }
      aside.resizing { pointer-events: none; user-select: none; }

      .aside-header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        font-weight: 600;
        color: var(--text-main);
      }

      .categories-list {
        flex: 1;
        overflow-y: auto;
      }
      .category-item {
        padding: 10px 16px;
        cursor: pointer;
        color: var(--text-main);
        border-left: 3px solid transparent;
      }
      .category-item.active {
        border-left-color: var(--accent);
        background: rgba(124, 58, 237, 0.08);
        color: var(--accent);
      }
      .category-item:hover { background: rgba(0,0,0,0.03); }

      .resizer {
        width: 6px;
        cursor: col-resize;
        background: var(--border);
        flex-shrink: 0;
      }
      .resizer:hover { background: var(--accent); }

      .content-area {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        background: var(--bg-page);
      }

      .results-count { margin-bottom: 16px; color: var(--text-secondary); }

      .card {
        background: var(--bg-sidebar);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 16px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      }
      .card h3 { margin-bottom: 8px; color: var(--text-main); }
      .card .text { color: var(--text-secondary); line-height: 1.5; }

      .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
      .error { color: #ef4444; text-align: center; padding: 20px; }

      @media (max-width: 768px) {
        aside { width: 70px; padding: 0; }
        .categories-list { display: none; }
        .aside-header span { display: none; }
        main { flex-direction: column; }
        aside { border-right: none; border-bottom: 1px solid var(--border); }
        .resizer { display: none; }
      }
    </style>
  </head>
  <body data-theme="light">
    <header>
      <div style="font-weight:600;">База знаний поддержки</div>
      <div class="toolbar">
        <input type="search" id="searchInput" placeholder="Поиск по шаблонам..." />
        <button class="btn btn-outline" id="refreshBtn" title="Обновить данные">🔄 Обновить</button>
        <button class="btn btn-primary" id="themeToggle">Тёмная тема</button>
      </div>
    </header>

    <main>
      <aside id="aside">
        <div class="aside-header"><span>Категории</span></div>
        <div class="categories-list" id="categoriesList"></div>
        <div class="resizer" id="resizer"></div>
      </aside>

      <div class="content-area">
        <div class="results-count" id="resultsCount">Загружено шаблонов: 0</div>
        <div id="templatesContainer"></div>
      </div>
    </main>

    <script>
      // ---------------------------------------------------------
      // ВСТАВЬ СЮДА СВОЮ CSV ССЫЛКУ, ЕСЛИ ЭТА НЕ СРАБОТАЕТ
      // Сейчас уже стоит твоя ссылка
      // ---------------------------------------------------------
      const csvUrl = 'https://script.google.com/macros/s/AKfycbynFsvoNtkTVPF15uX4nOZlIYppMTmBsrv17F1GqTsTHvJli5sv13sRWBUmrWJJrkO6XA/exec?callback=?';

      const categoriesListEl = document.getElementById('categoriesList');
      const templatesContainerEl = document.getElementById('templatesContainer');
      const searchInputEl = document.getElementById('searchInput');
      const refreshBtnEl = document.getElementById('refreshBtn');
      const themeToggleEl = document.getElementById('themeToggle');
      const asideEl = document.getElementById('aside');
      const resizerEl = document.getElementById('resizer');
      const resultsCountEl = document.getElementById('resultsCount');

      let templatesData = [];
      let currentCategory = null;

      function parseCSV(text) {
        const lines = text.trim().split('\n');
        if (lines.length < 2) return [];

        // Первая строка — заголовки
        const headers = lines[0].split(',').map(h => h.trim());

        const result = [];
        for (let i = 1; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;

          // Простой парсер CSV (работает для большинства шаблонов поддержки)
          const row = parseCSVRow(line);
          if (row.length !== headers.length) continue;

          const obj = {};
          headers.forEach((h, idx) => {
            obj[h] = row[idx] || '';
          });
          result.push(obj);
        }
        return result;
      }

      // Простая обработка CSV с учётом кавычек
      function parseCSVRow(row) {
        const result = [];
        let current = '';
        let inQuotes = false;

        for (let i = 0; i < row.length; i++) {
          const char = row[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            result.push(current.trim());
            current = '';
          } else {
            current += char;
          }
        }
        result.push(current.trim());
        return result;
      }

      async function loadTemplates() {
        refreshBtnEl.disabled = true;
        templatesContainerEl.innerHTML = '<div class="loading">Загрузка данных из таблицы…</div>';

        try {
          const response = await fetch(csvUrl);
          if (!response.ok) throw new Error('Ошибка сети или таблица недоступна');

          const text = await response.text();
          templatesData = parseCSV(text);

          renderCategories();
          renderTemplates();
          resultsCountEl.textContent = `Загружено шаблонов: ${templatesData.length}`;
        } catch (error) {
          console.error(error);
          templatesContainerEl.innerHTML = `<div class="error">Ошибка загрузки: ${error.message}. Проверь, что таблица опубликована как CSV.</div>`;
        } finally {
          refreshBtnEl.disabled = false;
        }
      }

      function renderCategories() {
        const categories = [...new Set(templatesData.map(t => t.category || 'Без категории'))];
        categoriesListEl.innerHTML = '';

        categories.forEach(cat => {
          const el = document.createElement('div');
          el.className = 'category-item' + (currentCategory === cat ? ' active' : '');
          el.textContent = cat;
          el.onclick = () => {
            currentCategory = cat;
            updateActiveCategory();
            renderTemplates();
          };
          categoriesListEl.appendChild(el);
        });
      }

      function updateActiveCategory() {
        const items = categoriesListEl.querySelectorAll('.category-item');
        items.forEach(el => {
          if (currentCategory && el.textContent === currentCategory) {
            el.classList.add('active');
          } else {
            el.classList.remove('active');
          }
        });
      }

      function filterTemplates(query, category) {
        return templatesData.filter(t => {
          const catMatch = !category || (t.category || '') === category;
          const q = query.toLowerCase();
          const titleMatch = (t.title || '').toLowerCase().includes(q);
          const textMatch = (t.text || '').toLowerCase().includes(q);
          return catMatch && (titleMatch || textMatch);
        });
      }

      function renderTemplates() {
        const query = searchInputEl.value.toLowerCase();
        const filtered = filterTemplates(query, currentCategory);

        templatesContainerEl.innerHTML = '';
        if (filtered.length === 0) {
          templatesContainerEl.innerHTML = '<div style="padding:20px;color:var(--text-secondary)">Ничего не найдено</div>';
          return;
        }

        filtered.forEach(t => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <h3>${escapeHtml(t.title)}</h3>
            <div class="text">${escapeHtml(t.text)}</div>
          `;
          templatesContainerEl.appendChild(card);
        });

        resultsCountEl.textContent = `Найдено: ${filtered.length}`;
      }

      function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      searchInputEl.addEventListener('input', renderTemplates);

      refreshBtnEl.addEventListener('click', loadTemplates);

      themeToggleEl.addEventListener('click', () => {
        const body = document.body;
        if (body.getAttribute('data-theme') === 'light') {
          body.setAttribute('data-theme', 'dark');
          themeToggleEl.textContent = 'Светлая тема';
        } else {
          body.setAttribute('data-theme', 'light');
          themeToggleEl.textContent = 'Тёмная тема';
        }
      });

      // Ресайз боковой панели
      let isResizing = false;
      let startX, startWidth;

      resizerEl.addEventListener('mousedown', e => {
        isResizing = true;
        startX = e.clientX;
        startWidth = asideEl.offsetWidth;
        asideEl.classList.add('resizing');
        document.body.style.userSelect = 'none';
      });

      window.addEventListener('mousemove', e => {
        if (!isResizing) return;
        const dx = e.clientX - startX;
        const newWidth = Math.max(200, Math.min(400, startWidth + dx));
        asideEl.style.width = newWidth + 'px';
      });

      window.addEventListener('mouseup', () => {
        if (!isResizing) return;
        isResizing = false;
        asideEl.classList.remove('resizing');
        document.body.style.userSelect = '';
      });

      // Старт
      loadTemplates();
    </script>
  </body>
</html>
